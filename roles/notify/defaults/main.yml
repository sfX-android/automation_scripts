---

tg_success: |
        {{ ICON_GOOD }} ***New build has finished\!***
        
        {{ device_cl | d('') }}{% if axp_build_recovery_only is defined and axp_build_recovery_only %} \- RECOVERY image{% endif %}
        
        Build ID: {{ build_id | regex_escape() }}
        {% if release_channel is defined %}
        Release channel: {{ release_channel | regex_escape() }}
        {% endif %}
        {% if ROM_TYPE is defined %}
        Release type: {{ ROM_TYPE | regex_escape() }}
        {% endif %}
        {% if sec_level_date is defined %}
        ***Platform security patch level:*** [{{ sec_level_date | regex_escape() }}](https://source.android.com/docs/security/bulletin/{{ sec_level_date | regex_replace('([0-9]+)(-[0-9]+)(-[0-9]+)','\1/\1\2-01' ) }})
        {% endif %}
        
        {{ rom_cl }}
        {% if kernel_cl is defined %}
        {{ kernel_cl }}
        {% endif %}
        {% if dtree_cl is defined %}
        {{ dtree_cl }}
        {% endif %}
        {% if cdtree_cl is defined %}
        {{ cdtree_cl }}
        {% endif %}
        
        {{ dl_links }}
        {% if ota_hint is defined and (axp_build_recovery_only is undefined or (axp_build_recovery_only is defined and not axp_build_recovery_only)) %}
        {{ ota_hint | replace("!","\!") | replace("-","\-")  | replace(".","\.") | replace(">","\>") }}
        {% endif %}
        
        ***SHA512:***
        {{ hash.stat.checksum | d(hashfile.stdout) | d("no hash found") }}

        {% if release_gpg_signing_key is defined and release_gpg_signing_key != '' %}
        ***GPG: {{ release_gpg_signing_key }}*** {{ release_gpg_signing_keys_links | d('') }}
        {% endif %}
        
        This build has been created by my [Ansible project](https://github.com/sfX-android/automation_scripts) \+ [Semaphore](https://ansible-semaphore.com) with ❤️

tg_success_min: |
        {{ ICON_GOOD }} ***New build has finished\!***

        Flavor: {{ ROM_FLAVOR | replace("-","\-") }} {{ android_shortversion | replace("-","\-") | replace(".","\.") }}

        Build ID: {{ build_id | replace(".","\.") }}
        Build ident: _{{ BUILDIDENT | replace("-","\-") }}_
        
        This build has been created by my [Ansible project](https://github.com/sfX-android/automation_scripts) \+ [Semaphore](https://ansible-semaphore.com) with ❤️

tg_failed: |
        {{ ICON_BAD }} ***ERROR:*** Last build failed\!
        \- OS: {{ ROM_FLAVOR | replace("-","\-") }} {{ android_shortversion | replace("-","\-") | replace(".","\.") }}
        \- Device: ***{{ BDEVICE | replace("-","\-") }}***
        \- Build ident: _{{ BUILDIDENT | replace("-","\-") }}_
        \- Build ID:  {{ build_id | regex_escape() }}
        {% if release_channel is defined %}
        \- Release channel: {{ release_channel | regex_escape() }}
        {% endif %}
        {% if ROM_TYPE is defined %}
        \- Release type: {{ ROM_TYPE | regex_escape() }}
        {% endif %}
