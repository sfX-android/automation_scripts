---

- name: "Sync kernel patcher repos"
  ansible.builtin.shell: |
    git pull
    git checkout origin/HEAD -f
    git pull
    git log -1
  args:
    executable: /bin/bash
    chdir: "{{ item }}"
  loop:
    - "{{ cve_kernel_cve_checker_path }}"
    - "{{ cve_kernel_patches_path }}"
    - "{{ cve_kernel_cip_path }}"
    - "{{ kernel_stable_path }}"
