---

- name: "Grab DOS CVE Checker"
  ansible.builtin.get_url:
    url: "{{ divest_cve_checker_download }}"
    dest: "{{ divest_cve_checker_jar }}"
    mode: 0640
  retries: 3
  delay: 10
  when: not skip_dl_cve_checker | d(False)

- name: "Run CIP update/fetch"
  ansible.builtin.shell: |
    git checkout {{ git_kernel_org_branch }}
    git fetch origin
    git rebase origin/{{ git_kernel_org_branch }}
    git branch -D $(date -uI) || true
    git checkout -b $(date -uI) || true
    git am ~/.config/kernel-sec/tweak.patch
    rm conf/remotes.y*ml  # to ease up handling our remotes config should be only in ~/.config/kernel-sec

    # revert slow-down commit
    # see: https://gitlab.com/cip-project/cip-kernel/cip-kernel-sec/-/commit/105a7541545edefd3f4f4bf800d72fc5220043a0#note_2444138025
    git revert -n 105a7541545edefd3f4f4bf800d72fc5220043a0

    # prepare & sync remotes
    # only needed once as further syncs are handled by: roles/kernel_patcher/tasks/sync.yml
    #./scripts/prepare_remotes.py --git-repo "{{ kernel_stable_path }}" >> {{ BUILD_LOG }} 2>&1

    # import
    ./scripts/import_stable.py --git-repo "{{ kernel_stable_path }}" >> {{ BUILD_LOG }} 2>&1 && echo "imported stable1 remote"
    git add -A >> {{ BUILD_LOG }} 2>&1 && git commit -a -m 'Import data from stable branches' >> {{ BUILD_LOG }} 2>&1
    
    ./scripts/import_debian.py --git-repo "{{ kernel_stable_path }}" >> {{ BUILD_LOG }} 2>&1 && echo "imported debian remote"
    git add -A >> {{ BUILD_LOG }} 2>&1 && git commit -a -m 'Import data from Debian' >> {{ BUILD_LOG }} 2>&1
    
    ./scripts/import_stable.py --git-repo "{{ kernel_stable_path }}" >> {{ BUILD_LOG }} 2>&1 && echo "imported stable2 remote"
    git add -A >> {{ BUILD_LOG }} 2>&1 && git commit -a -m 'Import data from stable branches' >> {{ BUILD_LOG }} 2>&1
    
    ./scripts/import_ubuntu.py --git-repo "{{ kernel_stable_path }}" >> {{ BUILD_LOG }} 2>&1 && echo "imported ubuntu remote"
    git add -A >> {{ BUILD_LOG }} 2>&1 && git commit -a -m 'Import data from Ubuntu' >> {{ BUILD_LOG }} 2>&1

    ./scripts/import_stable.py --git-repo "{{ kernel_stable_path }}" >> {{ BUILD_LOG }} 2>&1 && echo "imported stable3 remote"
    (git add -A >> {{ BUILD_LOG }} 2>&1 && git commit -a -m 'Import data from stable branches' >> {{ BUILD_LOG }} 2>&1) || true
  args:
    executable: /bin/bash
    chdir: "{{ cve_kernel_cip_path }}"

- name: "Run CIP tool"
  ansible.builtin.shell: |
      # create CIP.txt
      ./CIP.sh {{ cve_kernel_cip_path }} >> {{ BUILD_LOG }} 2>&1
  environment:
    DOS_BINARY_PATCHER: "{{ divest_cve_checker_jar }}"
    DOS_PATCHES_LINUX_CVES: "{{ cve_kernel_patches_path }}"
  args:
    executable: /bin/bash
    chdir: "{{ cve_kernel_patches_path }}"

- name: "Clean-up"
  ansible.builtin.shell: |
      # remove unwanted (i.e. non LTS) patches
      source ./rm-nonlts.sh
      rmVersions >> {{ BUILD_LOG }} 2>&1
  environment:
    DOS_BINARY_PATCHER: "{{ divest_cve_checker_jar }}"
    DOS_PATCHES_LINUX_CVES: "{{ cve_kernel_patches_path }}"
  args:
    executable: /bin/bash
    chdir: "{{ cve_kernel_patches_path }}"
