---

- name: "Get ASB harvester"
  ansible.builtin.git:
    repo: "{{ git_asb_harvester }}"
    dest: "{{ asb_harvester_path }}"
    force: true
  timeout: 180

- name: "Fetch ASB Kernel patches"
  ansible.builtin.shell: |
    go get github.com/dukebarman/android-bulletins-harvester >> {{ BUILD_LOG }} 2>&1
    go build . >> {{ BUILD_LOG }} 2>&1
    {% for t in bull_range | split(' ') %}
        ./android-bulletins-harvester -kernel -quiet -jsonk -url https://source.android.com/docs/security/bulletin/{{ t }} #2>> {{ BUILD_LOG }}
    {% endfor %}
  args:
    chdir: "{{ asb_harvester_path }}"
  register: asbk

- block:

    - name: "Parse the output and store it in a list"
      ansible.builtin.set_fact:
        cve_list: "{{ asbk.stdout_lines | map('from_json') | list }}"

    - name: "Check if patch exists already"
      ansible.builtin.shell: "grep -q '{{ item.link }}' {{ cve_kernel_patches_path }}/Kernel_CVE_Patch_List.txt"
      register: patch_exists
      ignore_errors: yes
      changed_when: false
      loop: "{{ cve_list }}"
      loop_control:
        loop_var: item

    - name: "Append CVE entry if required"
      ansible.builtin.lineinfile:
        path: "{{ cve_kernel_patches_path }}/Kernel_CVE_Patch_List.txt"
        line: "^{{ item.id }}-aosp$"
        insertafter: EOF
      loop: "{{ cve_list }}"
      when:
        - patch_exists is defined and patch_exists.results is not ""
    
    - name: "Append link if required"
      ansible.builtin.lineinfile:
        path: "{{ cve_kernel_patches_path }}/Kernel_CVE_Patch_List.txt"
        line: "        Link - {{ item.link }}"
        insertafter: "^{{ item.id }}-aosp$"
      loop: "{{ cve_list }}"
      when:
        - patch_exists is defined and patch_exists.results is not ""
    
  when: asbk.stdout != ""
