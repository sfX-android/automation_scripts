---

- name: "Push detected changes"
  ansible.builtin.shell: |      
      export LC_ALL=C
      CMT=0
      TE=0
      echo "processing: {{ item }}" >> {{ BUILD_LOG }}
      TAG="$(date +%F)"
      
      # add unstaged changes
      git add -A >> {{ BUILD_LOG }} 2>&1 || CMT=1

      # check for uncommitted changes
      CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)

      # commit if any of the above require it
      if [ $CMT -eq 1 -o $CMTL -gt 0 ];then 
          git commit --author="{{ git_kernel_patcher_author }}" -m "automated kernel patcher run" >> {{ BUILD_LOG }} 2>&1 \
            && echo "committed changes $(git log -1 --format=oneline)" >> {{ BUILD_LOG }} \
            && git pull --rebase origin main >> {{ BUILD_LOG }} 2>&1 \
            && git push --set-upstream origin >> {{ BUILD_LOG }} 2>&1 && echo "pushed changes!" >> {{ BUILD_LOG }}

          git tag -a "$TAG" -m "tagging state on $TAG" >> {{ BUILD_LOG }} 2>&1 || TE=1
          if [ $TE -eq 1 ];then
              (git tag -d "$TAG" >> {{ BUILD_LOG }} 2>&1; git push origin --delete "$TAG" >> {{ BUILD_LOG }} 2>&1 || true; git tag -a "$TAG" -m "tagging state on $TAG" >> {{ BUILD_LOG }} 2>&1)
              git push --set-upstream origin $TAG >> {{ BUILD_LOG }} 2>&1
              echo "[GIT] updated existing tag: $TAG" >> {{ BUILD_LOG }}
          else
              git push --set-upstream origin $TAG >> {{ BUILD_LOG }} 2>&1
              echo "[GIT] pushed new tag: $TAG" >> {{ BUILD_LOG }}
          fi
      fi
  args:
    executable: /bin/bash
    chdir: "{{ item }}"
  loop:
    - "{{ cve_kernel_cve_checker_path }}"
    - "{{ cve_kernel_patches_path }}"
