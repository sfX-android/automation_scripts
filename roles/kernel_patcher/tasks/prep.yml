---

- name: "Check/Create required dirs"
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ cve_kernel_cve_checker_path }}"
    - "{{ cve_kernel_patches_path }}"
    - "{{ cve_kernel_cip_path }}"
    - "{{ kernel_stable_path }}"

- name: "Configure remotes"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dst }}"
  loop:
    - { "src": "tweak.patch", "dst": "~/.config/kernel-sec/tweak.patch" }
    - { "src": "remotes.yml", "dst": "~/.config/kernel-sec/remotes.yml" }
    - { "src": "branches.yml", "dst": "~/.config/kernel-sec/branches.yml" }

- name: "Prep Kernel_CVE_Patch_List.txt"
  ansible.builtin.lineinfile:
    path: "{{ cve_kernel_patches_path }}/Kernel_CVE_Patch_List.txt"
    regexp: '^CVE-0000-0000'
    state: absent
