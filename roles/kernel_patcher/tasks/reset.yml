---

- name: "Reset kernel patcher dirs"
  ansible.builtin.shell: |
       echo "BEFORE reset:" >> {{ BUILD_LOG }}
       git log -1 >> {{ BUILD_LOG }} 2>&1
       git status >> {{ BUILD_LOG }} 2>&1
       if [ $? -eq 128 ];then
         echo "No local changes in kernel patcher repo found!"  >> {{ BUILD_LOG }}
       else
         git am --abort >> {{ BUILD_LOG }} 2>&1 || true
         git rebase --abort >> {{ BUILD_LOG }} 2>&1 || true
         git add -A . && git stash save befreset-$(date +%F_%T) >> {{ BUILD_LOG }} 2>&1 || true
       fi
       dbr=$(git symbolic-ref refs/remotes/origin/HEAD --short)
       git reset --hard $dbr >> {{ BUILD_LOG }} 2>&1
       git checkout $dbr
  args:
    chdir: "{{ item }}"
  loop:
    - "{{ cve_kernel_cve_checker_path }}"
    - "{{ cve_kernel_patches_path }}"
    - "{{ cve_kernel_cip_path }}"
    - "{{ kernel_stable_path }}"
