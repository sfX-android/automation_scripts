---

- name: "Check build result"
  ansible.builtin.fail:
    msg: "Build FAILED! Check log for details: {{ BUILD_LOG }}"
  when:
    - buildresult.rc is undefined or buildresult.rc != 0

- name: "Check log for fail pattern"
  ansible.builtin.shell: |
      {% if item.expect_cnt is defined %}
        RES=$(grep -coE '{{ item.search }}' {{ BUILD_LOG }})
        if [ "$RES" -eq '{{ item.expect_cnt }}' ];then
            echo 'Count >{{ item.expect_cnt }}< is matching on >{{ item.search }}<!'
        else
            echo 'Count >{{ item.expect_cnt }}< IS NOT MATCHING ON >{{ item.search }}<!!!'
            exit 3
        fi
      {% else %}
        RES=$(grep -oE '{{ item.search }}' {{ BUILD_LOG }})
        if [ "$RES" == '{{ item.expect }}' ];then
            echo '>{{ item.expect }}< is matching on >{{ item.search }}<!'
        else
            echo '>{{ item.expect }}< IS NOT MATCHING ON >{{ item.search }}<!!!'
            exit 3
        fi
      {% endif %}
  loop: "{{ parselogerr }}"
  when: parselogerr is defined

- name: "get build date"
  shell: "grep ro.build.date.utc {{ SRCPATH }}/out/target/product/*/system/build.prop | cut -d '=' -f2 "
  register: build_date_utc

- block:
    
    - set_fact:
        LOCFILE: "{{ PREFIXFNAME }}.*-{{ RELEASE_TYPE }}.*\\.zip"
      when:
        - ROM_FLAVOR != "TWRP"

    - set_fact:
        LOCFILE: "{{ PREFIXFNAME }}.*-{{ RELEASE_TYPE }}.*\\.img"
      when:
        - ROM_FLAVOR == "TWRP"

    - set_fact:
        LOCFILE: "{{ axp_recovery_filename }}"
      when:
        - ROM_FLAVOR == "axp"
        - axp_build_recovery_only is defined and axp_build_recovery_only
    
    - name: "Get current/latest build filename"
      ansible.builtin.shell: |
          {% if axp_build_eng | bool %}
          cd {{ SRCPATH }}/out/target/product/{{ sub_model | d(target_model) }}
          {% else %}
          cd {{ ZIPDIR }}
          {% endif %}
          find ./ -maxdepth 1 -regex '.*/{{ LOCFILE }}' -printf '%T@ %f\n' | sort -n | tail -1 | cut -d' ' -f2- | tr -d '\n' | sed 's#^\\./##g'
      register: ROMFILE

    - name: "Check file var"
      ansible.builtin.fail:
          msg: "FATAL: cannot get current/latest build filename!"
      when: ROMFILE.stdout is undefined or ROMFILE.stdout == ""

    - name: "Copy build.prop for OTA"
      shell: "cp -vf {{ SRCPATH }}/out/target/product/*/system/build.prop {{ ZIPDIR }}/{{ ROMFILE.stdout }}.prop"
      when:
        - ROM_FLAVOR != "TWRP"
        - ROM_FLAVOR != "SHRP"
        - axp_build_recovery_only is undefined or (axp_build_recovery_only is defined and not axp_build_recovery_only)
        - not axp_build_eng | bool

  when: custom_release_script is undefined or (custom_release_script is defined and not custom_release_script)
