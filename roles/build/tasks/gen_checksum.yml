---

- name: "Check hash existence"
  ansible.builtin.stat:
    path: "{{ ZIPDIR }}/{{ ROMFILE.stdout }}.sha512sum"
    checksum_algorithm: sha512
  register: hashreq
  no_log: true
  
- block:
    
    - name: "Write hash {{ ROMFILE.stdout }}.sha512sum"
      ansible.builtin.shell: |
        echo '{{ hash.stat.checksum }} {{ ROMFILE.stdout }}' > {{ ROMFILE.stdout }}.sha512sum
        
        {% if release_gpg_signing_key is defined and release_gpg_signing_key != '' %}
          checksum="{{ ROMFILE.stdout }}.sha512sum"
          {{ DOS_INIT }}
          echo "GPG signing $checksum with {{ release_gpg_signing_key }}" >> {{ BUILD_LOG }}
          if gpg --sign --local-user "{{ release_gpg_signing_key }}" --clearsign "$checksum" >> {{ BUILD_LOG }} 2>&1; then
            mv -vf "${checksum}.asc" "$checksum" >> {{ BUILD_LOG }} 2>&1
          fi
        {% endif %}
      args:
        chdir: "{{ ZIPDIR }}"

  when: not hashreq.stat.exists

- name: "Generate hash for {{ ROMFILE.stdout }}"
  ansible.builtin.stat:
     path: "{{ ZIPDIR }}/{{ ROMFILE.stdout }}"
     checksum_algorithm: sha512
  register: hash