---

- name: "Prep sig path"
  ansible.builtin.file:
    path: "{{ hypatia_signatures_path }}/virusshare_subset"
    state: directory
    mode: 0700

- name: "Check existence"
  ansible.builtin.stat:
    path: "{{ hypatia_signatures_path }}/virusshare_subset/virusshare_{{ item }}.md5"
  register: vs
  loop: "{{ range(465, 488) | list }}"

#- name: test
#  debug:
#    msg: "{{ item.item }}"
#  loop: "{{ vs.results }}"
#  when: "{{ item.stat.exists }}"
    
- name: "Get signatures"
  ansible.builtin.get_url:
    url: "{{ hypatia_uri_virusshare_base }}{{ item.item }}.md5"
    dest: "{{ hypatia_signatures_path }}/raw/virusshare_{{ item.item }}.md5"
    mode: 0400
  loop: "{{ vs.results }}"
  when: not item.stat.exists
