---

- name: "Prep sig path"
  ansible.builtin.file:
    path: "{{ hypatia_signatures_path }}/virusshare_subset"
    state: directory
    mode: 0700

- name: "Check existence"
  ansible.builtin.stat:
    path: "{{ hypatia_signatures_path }}/virusshare_subset/virusshare_{{ item }}.md5"
  register: vs
  loop: "{{ range(465, 488) | list }}"

- name: test
  fail:
    msg: "{{ item }}"
  loop: "{{ vs.results }}"
    
- name: "Get signatures"
  ansible.builtin.get_url:
    url: "{{ hypatia_uri_virusshare_base }}{{ item}}"
    dest: "{{ hypatia_signatures_path }}/virusshare_subset/virusshare_{{ item }}.md5"
    mode: 0400
  loop: "{{ range(465, 488) | list }}"

- name: "Parse signatures"
  ansible.builtin.shell: |
    echo
  args:
    executable: /bin/bash
    chdir: "{{ hypatia_signatures_path }}/"

  when: dosdir.stat.isdir is undefined
