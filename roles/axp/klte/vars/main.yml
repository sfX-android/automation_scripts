---
# human readable model name
target_model_full: "Samsung S5"

# boot debugger path & config
extendrom_debug_path_default: /cache
extendrom_debug_path_size_full_default: 500 
extendrom_debug_path_size_kernel_default: 100
extendrom_debug_path_size_selinux_default: 200
extendrom_debug_path_size_crash_default: 200

# extend extendrom_package_list
#extendrom_package_list: "{{ extendrom_package_list_default }} opencamera_j5_latest"
extendrom_package_list: "Phonesky_AXP-OS additional_repos.xml Magisk_v27.0 AuroraStore MicrogGmsCore_GH GsfProxy_GH noeSpeakNG NeoLauncher-latest"

# path to the kernel dir (req for e.g. wireguard)
target_kernel_dir: kernel/samsung/msm8974

# common defaults overrides
#vbmeta_verify: false

# enable kernel patching for unsupported devices
#divest_unsupported_device: true

# disable Wireguard patching (unsupported, bc kernel = v3.4)
skip_wireguard: True

# no verified boot:
vbmeta_verify: false

extendrom_allow_any_call_recording: 'true'
