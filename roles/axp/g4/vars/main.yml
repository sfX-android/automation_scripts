---
# human readable model name
target_model_vendor: LGE
target_model_name: 'G4'
target_model_full: "{{ target_model_vendor }} {{ target_model_name }} {{ sub_model | d('') }}"

# android version
android_shortversion: a11

# boot debugger path & config
extendrom_debug_path_default: /persist
extendrom_debug_path_size_full_default: 500 
extendrom_debug_path_size_kernel_default: 100
extendrom_debug_path_size_selinux_default: 200
extendrom_debug_path_size_crash_default: 200

# increasing key size is not supported for A9
#extendrom_signing_patches: 'false'

# special G4 manifest branch
git_repo_local_manifests_branch: "{{ ROM_FLAVOR }}-{{ android_shortversion }}_g4"

# path to the kernel dir (req for e.g. wireguard)
target_kernel_dir: kernel/lge/msm8992

# path to the common tree, if none exists the device tree
# required e.g. for git, vendor/axp, release handling etc
target_model_common_tree: device_lge_g4-common

# common defaults override:
rempath: "/home/nightlies/roms/{{ ROM_FLAVOR }}/{{ sub_model }}/"
post_cleanup_product_override: "{{ SEPARATE_OUT_DIR }}/target/product/{{ sub_model }}"
# disable verified boot
vbmeta_verify: false
axp_enable_avb: 'false'

# git push
axp_git_push_device_include: "device_lge_g4|{{ target_model_common_tree }}"
axp_git_push_vendor_include: "vendor_lge"

# enable kernel patching
# this kernel is special bc it (still) exists in Fix_CVE_Patchers.sh (they supported it a while ago)
# but as they removed the patcher script we need to set it to unsupported:
divest_unsupported_device: true
unsupported_device_kernel_patch: true

# this is a low-end device (optimize for performance)
axp_lowend_device: True

dl_links: |-
  ***Download:*** [{{ ROMFILE.stdout | replace("-","\-") | replace("_","\_") | replace(".","\.") }} ]({{ leech_server }}/axp/{{ sub_model }})

# CONFIG_STRICT_MEMORY_RWX=y breaks boot!
axp_defconfig_device: "CONFIG_STRICT_MEMORY_RWX=n"

# removing IMS will break boot
# > "/vendor/bin/imscmservice": library "lib-imsrcscmservice.so" not found: needed by main executable
axp_deblobber_remove_ims: 'false'
axp_deblobber_remove_rcs: 'false'

# libcir is needed by consumerir
axp_deblobber_remove_ir: 'false'

# special testing area
extendrom_intercept_installsrc: 'true'
