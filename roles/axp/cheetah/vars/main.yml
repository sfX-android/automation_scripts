---
# human readable model name
target_model_vendor: "Google"
target_model_name: "Pixel 7 Pro"
target_model_full: "{{ target_model_vendor }} {{ target_model_name }}"

# android version
android_shortversion: a15

# boot debugger path & config
extendrom_debug_path_default: /mnt/vendor/persist
extendrom_debug_path_size_full_default: 500 
extendrom_debug_path_size_kernel_default: 100
extendrom_debug_path_size_selinux_default: 200
extendrom_debug_path_size_crash_default: 200

# kernel
target_kernel_dir: kernel/google/gs201/private/gs-google
pixel_kernel_buildcmd: "./build_pantah.sh --config=no_download_gki --config=no_download_gki_fips140 --lto=full"
###git_pixel_kernel_manifest_branch: "common-android14-6.1-{{ current_year }}-{{ current_month }}"
git_pixel_kernel_manifest_branch: "15-qpr2"
pixel_kernel_buildresult: "device/google/pantah-kernels/6.1"
pixel_kernel_buildout: "out/pantah/dist"

# path to the common tree, if none exists the device tree
# required e.g. for git, vendor/axp, release handling etc
target_model_common_tree: device_google_gs201

# disable Wireguard patching (already part of the upstream kernel)
skip_wireguard: True

# add OpenEUICC
extendrom_package_list: "{{ extendrom_package_list_default }} OpenEUICC_AXP-OS"

# allow creating factory image
custom_build_command: "{{ SH_COMMON_PIXEL_CREATE_FACTORY }}"

# Bootloader ID (first line) for verifying build log
axp_bootloader_id_pro: '6F32410F17EF997F'
axp_bootloader_id_slim: ''

# git push
axp_git_push_device_include: "device_google_cheetah|device_google_pantah|device_google_gs-common|{{ target_model_common_tree }}" 
axp_git_push_vendor_include: "vendor_google_cheetah"

# website info
hugo_encryption: "FBEv2"
hugo_firmware: "included"
hugo_relockable: "yes"
hugo_state: "stable"
hugo_supportlevel: "team"
hugo_isab: "yes"
hugo_xda_link: "https://xdaforums.com/t/rom-a13-official-microg-hardened-cheetah-axp-os-20-0.4668457/"
hugo_first_releasedate: "2024-05-27 (A13)"
#hugo_kb_link: ""
#hugo_custom_installguide_path: 
hugo_axp_bootloader_id_pro: |
   BOOTLOADER minimal ID
        6F32410F

   BOOTLOADER full ID:
        6F32410F17EF997F
        1E2978C318FDFA64
        27A01ABA881492E4
