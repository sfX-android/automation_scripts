---

- include_vars: "../../{{ target_model }}/vars/main.yml"

- name: DEBUG
  ansible.builtin.debug:
    msg: |
      target_model: {{ target_model }}
      axp_switchMR_upstream_branch: {{ los_version_gitbranch }}
      axp_switchMR_target_branch: {{ git_repo_local_manifests_branch }}
      device_tree: {{ target_model_common_tree }}

- include_tasks: create_semaphore_task.yml
  vars:
    semaphore_aos_template_name: "AOS {{ axp_type }}: {{ target_model_full }} ({{ target_model }})"
    semaphore_aos_template_env_id: "{{ target_model }}"
    semaphore_aos_template_view_id: {% if axp_type == "slim" %}36{% else %}35{% endif %}

- include_tasks: device.yml
  vars:
    target_model: "{{ target_model }}"
    axp_switchMR_upstream_branch: "{{ los_version_gitbranch }}"
    axp_switchMR_target_branch: "{{ git_repo_local_manifests_branch }}"
    device_tree: "{{ target_model_common_tree }}"

- include_tasks: kernel.yml
  vars:
    target_model: "{{ target_model }}"
    axp_switchMR_upstream_branch: "{{ los_version_gitbranch }}"
    axp_switchMR_target_branch: "{{ git_repo_local_manifests_branch }}"
