---

- include_vars: "../../{{ target_model }}/vars/main.yml"

- name: DEBUG
  ansible.builtin.debug:
    msg: |
      target_model: {{ target_model }}
      axp_switchMR_upstream_branch: {{ los_version_gitbranch }}
      axp_switchMR_target_branch: {{ git_repo_local_manifests_branch }}
      axp_switchMR_init_branch: {{ axp_switchMR_init_branch }}
      device_tree: {{ device_tree }}
      git_commit_args: {{ git_commit_args | d('undef') }}
      
- include_tasks: device.yml
- include_tasks: kernel.yml