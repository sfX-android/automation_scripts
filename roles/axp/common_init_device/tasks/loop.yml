---

- name: "VARS: include target model vars"
  ansible.builtin.include_vars: "../../{{ target_model }}/vars/main.yml"

- name: "VARS: include slim vars"
  ansible.builtin.include_vars: "../../common/tasks/axp-slim.vars.yml"
  when: (axp_type | d(ROM_FLAVOR)) == "slim"

- name: "(Re)Set build log"
  ansible.builtin.set_fact:
      BUILD_LOG: >-
        {% if build_log_init is defined %}{{ build_log_init }}{% else %}{{ BUILD_LOG }}{% endif %}

- name: Set unfiltered combined device + kernel list
  ansible.builtin.set_fact:
    all_device_repos: >-
      {{ (
          axp_git_push_device_include.split('|') + 
          axp_git_push_vendor_include.split('|') + 
          [target_kernel_dir | regex_replace('/', '_')]
      )| unique }}

- name: Set conditional device+kernel list
  ansible.builtin.set_fact:
    all_repos_filtered: >-
      {{
        (
          axp_git_push_device_include.split('|')
          + axp_git_push_vendor_include.split('|')
          + (
              [target_kernel_dir | regex_replace('/', '_')]
              if not (git_pixel_kernel_manifest_branch is defined
                      and target_model_vendor == "Google")
              else [git_pixel_kernel_repo_name]
            )
        ) | unique
      }}

- name: DEBUG
  ansible.builtin.debug:
    msg: |
      target_model: {{ target_model }}
      axp_switchMR_upstream_branch: {{ los_version_gitbranch }}
      axp_switchMR_target_branch: {{ git_repo_local_manifests_branch }}
      all_device_repos: {{ all_device_repos }}

      "reset_git": {{ reset_git }}
      "debug_build": {{ debug_build }}
      "ROM_FLAVOR": {{ ROM_FLAVOR }}
      "override_reset_git": {{ override_reset_git }}
      "override_clean_out": {{ override_clean_out }}
      "axp_skip_common_tasks": {{ axp_skip_common_tasks }}

      "skip_setup_otaverify": {{ skip_setup_otaverify }}
      "skip_setup_repos": {{ skip_setup_otaverify }}
      "skip_setup_firmware": {{ skip_setup_firmware }}
      "skip_setup_manifest": {{ skip_setup_manifest }}
      "skip_setup_ansible": {{ skip_setup_ansible }}
      "skip_setup_website": {{ skip_setup_website }}
      "skip_mirror_activation": {{ skip_mirror_activation }}
      "skip_setup_semaphore": {{ skip_setup_semaphore }}

- name: "Setup all push target repos"
  ansible.builtin.include_tasks: setup_repos.yml
  loop: "{{ all_device_repos }}"
  loop_control:
    loop_var: device_repo
  vars:
    target_model: "{{ target_model }}"
    axp_switchMR_upstream_branch: "{{ los_version_gitbranch }}"
    axp_switchMR_target_branch: "{{ git_repo_local_manifests_branch }}"
    device_tree: "{{ device_repo }}"
  when:
    - not skip_setup_repos | bool

- name: "Setup all push target repos: mirror-activation"
  ansible.builtin.include_tasks: start_mirroring.yml
  when: not skip_mirror_activation | bool

- name: "Setup Vendor Firmware"
  ansible.builtin.include_tasks: setup_vendor_firmware.yml
  when: not skip_setup_firmware | bool

- name: "Setup Manifest XML"
  ansible.builtin.include_tasks: setup_manifest.yml
  when: not skip_setup_manifest | bool

- name: "Setup Ansible automation vars"
  ansible.builtin.include_tasks: setup_ansible.yml
  when: not skip_setup_ansible | bool

- name: "Setup Semaphore task template"
  ansible.builtin.include_tasks: setup_semaphore.yml
  vars:
    semaphore_aos_template_name: "AOS {{ git_repo_local_manifests_branch | upper | regex_replace('AXP-','') }} {{ axp_type | regex_replace('slim','Slim') | regex_replace('pro','Pro') }}: {{ target_model_full }} ({{ target_model }})"
  when: not skip_setup_semaphore | bool

- name: "Setup OTA/AVB key repo"
  ansible.builtin.include_tasks: setup_otaverify.yml
  when: not skip_setup_otaverify | bool

- name: "Setup Website"
  ansible.builtin.include_tasks: setup_website.yml
  when: not skip_setup_website | bool
