---

- ansible.builtin.set_fact:
    init_device_temp_path: /tmp/init_manifest

- name: "Setup manifest: Start clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent

- name: "Setup manifest: fetch AXP.OS manifest"
  ansible.builtin.git:
    repo: "{{ git_axpos_org_private }}/manifest"
    dest: "{{ init_device_temp_path }}"
    version: "{{ git_repo_local_manifests_branch }}"
  timeout: 180

- name: "Setup manifest: add header"
  ansible.builtin.lineinfile:
      path: "{{ init_device_temp_path }}/axp.xml"
      regexp: ".*{{ target_model_full }} .*"
      line: "\t<!-- {{ target_model_full }} ({{ sub_model | d(target_model) }}) -->"
      insertbefore: '<!\-\- END OF DEVICE REPOS \-\->'
      state: present

- name: "Setup manifest: add info"
  ansible.builtin.lineinfile:
      path: "{{ init_device_temp_path }}/axp.xml"
      regexp: 'uses {{ target_model_common_tree }}.*{{ target_kernel_dir | regex_replace("/","_") }}'
      line: "\t<!-- uses {{ target_model_common_tree }} / {{ target_kernel_dir | regex_replace('/','_') }} -->"
      insertafter: '<!\-\- {{ target_model_full | regex_escape() }} \({{ sub_model | d(target_model) | regex_escape() }}\) \-\->'
      state: present
  register: info_added
  when:
      - not (git_pixel_kernel_manifest_branch is defined and target_model_vendor == "Google")

- name: "Setup manifest: add info (Pixels via kleaf)"
  ansible.builtin.lineinfile:
      path: "{{ init_device_temp_path }}/axp.xml"
      regexp: 'uses {{ target_model_common_tree }}.*{{ target_kernel_dir | regex_replace("/","_") }}'
      line: "\t<!-- uses {{ target_model_common_tree }} / https://{{ git_axpos_org_public_host }}/{{ git_axpos_org_name }}/{{ git_pixel_kernel_repo_name }} -->"
      insertafter: '<!\-\- {{ target_model_full | regex_escape() }} \({{ sub_model | d(target_model) | regex_escape() }}\) \-\->'
      state: present
  register: pixinfo_added
  when:
      - git_pixel_kernel_manifest_branch is defined and target_model_vendor == "Google"

- name: "Setup manifest: add all defined repos"
  ansible.builtin.lineinfile:
      path: "{{ init_device_temp_path }}/axp.xml"
      regexp: 'name="\w+_{{ device_repo }}"'
      line: "\t{% if device_repo is search('vendor_.*') %}<project path=\"{{ device_repo | regex_replace('_','/') }}\" name=\"proprietary_{{ device_repo }}\" remote=\"axp.os-private\" />{% else %}<project path=\"{{ device_repo | regex_replace('_','/') }}\" name=\"{{ device_repo }}\" remote=\"axp.os\" />{% endif %}"
      insertafter: '<!\-\- {{ target_model_full | regex_escape() }} \({{ sub_model | d(target_model) | regex_escape() }}\) \-\->'
      state: present
  loop: "{{ all_device_repos }}"
  loop_control:
    loop_var: device_repo
  when:
      - not (git_pixel_kernel_manifest_branch is defined and target_model_vendor == "Google" and 'kernel' in device_repo)

- name: "Setup manifest: add & push changes"
  ansible.builtin.shell: |
      echo "[GIT][MANIFEST] starting git commit process" >> {{ BUILD_LOG }}
      source {{ BUILDHOME }}/.divested.vars.{{ sub_model | d(target_model) }}-{{ android_shortversion }}-{{ axp_type }}
    
      CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)
      if [ $CMTL -gt 0 ];then
          git add -A >> {{ BUILD_LOG }} 2>&1 || CMT=1
          git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "{{ sub_model | d(target_model) }}: added/updated manifest" >> {{ BUILD_LOG }} 2>&1
          echo "[GIT][MANIFEST] git commit done" >> {{ BUILD_LOG }}

          CURHASH=$(git log -1 --format=oneline | cut -d ' ' -f1)
          REMHASH=$(git log --pretty=oneline --decorate | grep "origin/{{ git_repo_local_manifests_branch }}" |cut -d ' ' -f1)
            
          if [ "$CURHASH" != "$REMHASH" ]; then
              echo "[GIT][MANIFEST] pushing required ($CURHASH != $REMHASH)!" >> {{ BUILD_LOG }}
              git push origin {{ git_repo_local_manifests_branch }} >> {{ BUILD_LOG }} 2>&1
          else
              echo "[GIT][MANIFEST] pushing skipped ($CURHASH == $REMHASH)!" >> {{ BUILD_LOG }}
          fi
      else
          echo "[GIT][MANIFEST] git commit skipped (no changes)" >> {{ BUILD_LOG }}
      fi
  args:
      chdir: "{{ init_device_temp_path }}"
      executable: /bin/bash
        
- name: "Setup manifest: End clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent
