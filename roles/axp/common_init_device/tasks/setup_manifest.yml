---

- ansible.builtin.set_fact:
    init_device_temp_path: /tmp/init_manifest

- block:
        
        - name: "Setup manifest: Start clean"
          ansible.builtin.file:
              path: "{{ init_device_temp_path }}"
              state: absent
        
        - name: "Setup manifest: fetch AXP.OS manifest"
          ansible.builtin.git:
            repo: "{{ git_repo_local_manifests }}"
            dest: "{{ init_device_temp_path }}"
            version: "{{ git_repo_local_manifests_branch }}"
          timeout: 180

  
  when: dsakjsakldjalskdj is defined
  

- name: "Setup manifest: add header"
  ansible.builtin.lineinfile:
      path: "{{ init_device_temp_path }}/axp.xml"
      search_string: "{{ target_model_full }} ({{ sub_model | d(target_model) }})"
      line: "\t<!-- {{ target_model_full }} ({{ sub_model | d(target_model) }}) -->"
      insertbefore: '<!\-\- END OF DEVICE REPOS \-\->'
      state: present

- name: "Setup manifest: add info"
  ansible.builtin.lineinfile:
      path: "{{ init_device_temp_path }}/axp.xml"
      search_string: 'uses {{ target_model_common_tree }} / {{ target_kernel_dir | regex_replace("/","_") }}'
      line: "\t<!-- uses {{ target_model_common_tree }} / {{ target_kernel_dir | regex_replace('/','_') }} (see above) -->\n"
      insertafter: '<!\-\- {{ target_model_full | regex_escape() }} \({{ sub_model | d(target_model) | regex_escape() }}\) \-\->'
      state: present

- name: "Setup manifest: add all defined repos"
  ansible.builtin.lineinfile:
      path: "{{ init_device_temp_path }}/axp.xml"
      regexp: 'name="\w+_{{ device_repo }}"'
      line: "\t{% if device_repo is search('vendor_.*') %}<project path=\"{{ device_repo | regex_replace('_','/') }}\" name=\"proprietary_{{ device_repo }}\" remote=\"axp.os-private\" />{% else %}<project path=\"{{ device_repo | regex_replace('_','/') }}\" name=\"android_{{ device_repo }}\" remote=\"axp.os\" />{% endif %}"
      insertafter: '<!\-\- {{ target_model_full | regex_escape() }} \({{ sub_model | d(target_model) | regex_escape() }}\) \-\->'
      state: present
  loop: "{{ all_device_repos }}"
  loop_control:
    loop_var: device_repo 

- name: "Setup manifest: add & push changes"
  ansible.builtin.shell: |
      echo "[MANIFEST] starting git commit process" >> {{ BUILD_LOG }}
      source {{ BUILDHOME }}/.divested.vars.{{ sub_model | d(target_model) }}
    
      CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)
      if [ $CMTL -gt 0 ];then
          git add -A >> {{ BUILD_LOG }} 2>&1 || CMT=1
          git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "{{ sub_model | d(target_model) }}: added/updated manifest" >> {{ BUILD_LOG }} 2>&1
          echo "[MANIFEST] git commit done" >> {{ BUILD_LOG }}

          CURHASH=$(git log -1 --format=oneline | cut -d ' ' -f1)
          REMHASH=$(git log --pretty=oneline --decorate | grep "origin/{{ git_repo_local_manifests_branch }}" |cut -d ' ' -f1)
            
          if [ "$CURHASH" != "$REMHASH" ]; then
              echo "[GIT] pushing required ($CURHASH != $REMHASH)!" >> {{ BUILD_LOG }}
          else
              echo "[GIT] pushing skipped ($CURHASH == $REMHASH)!" >> {{ BUILD_LOG }}
          fi
      else
           echo "[MANIFEST] git commit skipped (no changes)" >> {{ BUILD_LOG }}
      fi
  args:
      chdir: "{{ init_device_temp_path }}"
      executable: /bin/bash

- fail:
    msg: boo
        
- name: "Setup manifest: End clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent
