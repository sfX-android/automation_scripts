---

- ansible.builtin.set_fact:
    init_device_temp_path: >-
        {% if skip_setup_firmware_fetch and vendor_firmware_aosp_path is defined %}{{ vendor_firmware_aosp_path }}{% else %}{{ android_build_path }}/.tmp/init_firmware{% endif %}

- name: "Setup firmware: Start clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent
  when: not skip_setup_firmware_clean

- name: "Setup firmware: fetch git repo"
  ansible.builtin.git:
    repo: "{{ init_device_vendorfirmware }}"
    dest: "{{ init_device_temp_path }}"
    version: "{{ git_repo_local_manifests_branch }}"
    remote: "{{ init_device_remotename | d('origin') }}"
    depth: 1
    single_branch: true
  timeout: 180

- name: "Setup firmware: add/update 0SOURCE"
  ansible.builtin.template:
      src: vendor_firmware.j2
      dest: "{{ init_device_temp_path }}/{{ sub_model | d(target_model) }}/0SOURCE"
  register: info_added

- name: "Setup firmware: build lpunpack"
  ansible.builtin.shell: |
    {{ DOS_INIT }}
    
    echo "Factory contains super image(s), building lpunpack ..." | tee -a {{ BUILD_LOG }}
    build_req=0

    which lpunpack || build_req=1

    if [ $build_req -eq 1 ];then
      {% if sub_model is defined %}
      lunch lineage_{{ sub_model }}${brf_suffix}-user >> {{ BUILD_LOG }} 2>&1 && echo lunch success
      {% else %}
      lunch lineage_{{ target_model }}${brf_suffix}-user >> {{ BUILD_LOG }} 2>&1 && echo lunch success
      {% endif %}
      resetEnv >> {{ BUILD_LOG }} 2>&1
      
      # quick workaround for unrecognized property "product_variables.device_has_arm_mte"
      mv external/hardened_malloc/Android.bp hmall.Androidbp
      
      export ALLOW_MISSING_DEPENDENCIES=true
      m -j{{ max_processes }} lpunpack >> {{ BUILD_LOG }} 2>&1

      # revert build workaround
      mv hmall.Androidbp external/hardened_malloc/Android.bp
    else
      echo "skipping lpunpack build (binary exists already)" | tee -a {{ BUILD_LOG }}
    fi
  args:
    executable: /bin/bash
    chdir: "{{ SRCPATH }}"
  when: vendor_firmware_super_img

- name: "Download factory image"
  ansible.builtin.get_url:
      url: "{{ vendor_factory_download_url }}"
      dest: "{{ vendor_factory_persistent_path }}"
      checksum: >-
        {% if vendor_factory_download_sha512 is defined %}sha512:{{ vendor_factory_download_sha512 }}{% elif vendor_factory_download_sha256 is defined %}sha256:{{ vendor_factory_download_sha256 }}{% else %}99999{% endif %}
  when: vendor_factory_id is defined

- name: "Download firmware image"
  ansible.builtin.get_url:
      url: "{{ vendor_firmware_download_url }}"
      dest: "{{ vendor_firmware_persistent_path }}"
      checksum: >-
        {% if vendor_firmware_download_sha512 is defined %}sha512:{{ vendor_firmware_download_sha512 }}{% elif vendor_firmware_download_sha256 is defined %}sha256:{{ vendor_firmware_download_sha256 }}{% else %}99999{% endif %}
  when: vendor_firmware_download_url is defined

- name: "Setup firmware: Update ... (non-fairphone)"
  ansible.builtin.shell: |
          export PATH="{{ BUILDHOME }}/.local/bin:$HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          
          {% if vendor_firmware_persistent_path is defined %}export PERSISTZIP="{{ vendor_firmware_persistent_path }}"{% endif %}
          
          ./update_firmware.sh >> {{ BUILD_LOG }} 2>&1
  environment:
    DOWNLOAD_URL: "{{ vendor_firmware_download_url }}"
    DOWNLOAD_MD5: "{{ vendor_firmware_download_md5 | d('undefined') }}"
    DOWNLOAD_SHA1: "{{ vendor_firmware_download_sha1 | d('undefined') }}"
    DOWNLOAD_SHA256: "{{ vendor_firmware_download_sha256 | d('undefined') }}"
    DOWNLOAD_SHA512: "{{ vendor_firmware_download_sha512 | d('undefined') }}"
    TARGET_VENDOR: "{{ target_model_vendor | lower }}"
    TARGET_MODEL: "{{ target_model | lower }}"
    TMPDIR: "{{ android_build_path }}/.tmp"
    ANDROIDVER: "{{ android_version_int }}"
  args:
    chdir: "{{ init_device_temp_path }}"
    executable: /bin/bash
  when: target_model_vendor != "Fairphone"

- name: "Setup firmware: Update ... (fairphone)"
  ansible.builtin.shell: |
    {{ DOS_INIT }}

    echo "Fairphone firmware handling ..." | tee -a {{ BUILD_LOG }}

    lunch lineage_{{ sub_model | d(target_model) }}${brf_suffix}-user >> {{ BUILD_LOG }} 2>&1 && echo lunch success
    cd vendor/firmware/{{ target_model }}
    ./update.sh >> {{ BUILD_LOG }} 2>&1
  environment:
    FACZIP: "{{ vendor_factory_persistent_path | d(vendor_firmware_persistent_path) }}"
    FACTORYID: "{{ vendor_factory_id | d(vendor_firmware_version) }}"
    ANDROIDSHORTVERSION: "{{ android_shortversion }}"
    CODEN: "{{ target_model }}"
  args:
    executable: /bin/bash
    chdir: "{{ SRCPATH }}"
  when: target_model_vendor == "Fairphone"

- name: "Setup firmware: add & push changes"
  ansible.builtin.shell: |
      echo "[GIT][FIRMWARE] starting git commit process" >> {{ BUILD_LOG }}
      source {{ BUILDHOME }}/.divested.vars.{{ sub_model | d(target_model) }}-{{ android_shortversion }}-{{ axp_type }}
    
      CMTL=$(git status --porcelain=v1 {{ target_model }}/0SOURCE | wc -l 2>/dev/null)
      if [ $CMTL -gt 0 ];then
          git add {{ target_model }}/0SOURCE >> {{ BUILD_LOG }} 2>&1 || CMT=1
          source {{ target_model }}/0SOURCE
          git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "{{ sub_model | d(target_model) }}: add/update patch date: $VENDOR_SECPATCH_DATE" >> {{ BUILD_LOG }} 2>&1
          echo "[GIT][FIRMWARE] git commit done for 0SOURCE (vars)" >> {{ BUILD_LOG }}
      else
          echo "[GIT][FIRMWARE] git commit skipped for 0SOURCE (no changes)" >> {{ BUILD_LOG }}
      fi
      
      CMTLF=$(git status --porcelain=v1 | wc -l 2>/dev/null)
      if [ $CMTLF -gt 0 ];then
          git add -A >> {{ BUILD_LOG }} 2>&1 || CMT=1
          source {{ target_model }}/0SOURCE
          git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "{{ sub_model | d(target_model) }}: add/update {{ vendor_firmware_version | d(vendor_factory_id) }} ($VENDOR_SECPATCH_DATE)" >> {{ BUILD_LOG }} 2>&1
          echo "[GIT][FIRMWARE] git commit done for all the rest (vars)" >> {{ BUILD_LOG }}
      else
          echo "[GIT][FIRMWARE] git commit skipped for all the rest (no changes)" >> {{ BUILD_LOG }}
      fi

      CURHASH=$(git log -1 --format=oneline | cut -d ' ' -f1)
      REMHASH=$(git log --pretty=oneline --decorate | grep "{{ init_device_remotename | d('origin') }}/{{ git_repo_local_manifests_branch }}" |cut -d ' ' -f1)
        
      if [ "$CURHASH" != "$REMHASH" ]; then
          echo "[GIT][FIRMWARE] pushing required ($CURHASH != $REMHASH)!" >> {{ BUILD_LOG }}
          git push "{{ init_device_remotename | d('origin') }}" {{ git_repo_local_manifests_branch }} >> {{ BUILD_LOG }} 2>&1
      else
          echo "[GIT][FIRMWARE] pushing skipped ($CURHASH == $REMHASH)!" >> {{ BUILD_LOG }}
      fi
  args:
      chdir: "{{ init_device_temp_path }}"
      executable: /bin/bash

- name: "Setup firmware: End clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent
  when: not skip_setup_firmware_clean
