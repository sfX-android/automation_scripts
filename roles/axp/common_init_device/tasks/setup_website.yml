---

- ansible.builtin.set_fact:
    init_device_temp_path: /tmp/init_website

- name: "Setup website: Start clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent

- name: "Setup website: fetch git repo"
  ansible.builtin.git:
    repo: "{{ init_device_website_repo }}"
    dest: "{{ init_device_temp_path }}"
    version: "{{ init_device_website_branch }}"
  timeout: 180

- name: "Setup website: add/update android version"
  ansible.builtin.template:
      src: hugo_params.j2
      dest: "{{ init_device_temp_path }}/params/device_{{ sub_model | d(target_model) }}.params"
  register: info_added

- name: "Setup website: add & push changes"
  ansible.builtin.shell: |
      echo "[GIT][WEBSITE] starting git commit process" >> {{ BUILD_LOG }}
      source {{ BUILDHOME }}/.divested.vars.{{ sub_model | d(target_model) }}
    
      CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)
      if [ $CMTL -gt 0 ];then
          git add -A >> {{ BUILD_LOG }} 2>&1 || CMT=1
          git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "axp: {{ sub_model | d(target_model) }}: added/updated vars" >> {{ BUILD_LOG }} 2>&1
          echo "[GIT][WEBSITE] git commit done" >> {{ BUILD_LOG }}

          CURHASH=$(git log -1 --format=oneline | cut -d ' ' -f1)
          REMHASH=$(git log --pretty=oneline --decorate | grep "origin/{{ git_repo_local_manifests_branch }}" |cut -d ' ' -f1)
            
          if [ "$CURHASH" != "$REMHASH" ]; then
              echo "[GIT][WEBSITE] pushing required ($CURHASH != $REMHASH)!" >> {{ BUILD_LOG }}
              #git push origin {{ init_device_website_branch }} >> {{ BUILD_LOG }} 2>&1
          else
              echo "[GIT][WEBSITE] pushing skipped ($CURHASH == $REMHASH)!" >> {{ BUILD_LOG }}
          fi
      else
           echo "[GIT][WEBSITE] git commit skipped (no changes)" >> {{ BUILD_LOG }}
      fi
  args:
      chdir: "{{ init_device_temp_path }}"
      executable: /bin/bash
  when: info_added.changed

- fail:
    msg: boooooo


- name: "Setup website: End clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent

