---

- ansible.builtin.set_fact:
    init_device_temp_path: /tmp/init_ansible

- name: "Setup ansible: Start clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent

- name: "Setup ansible: fetch git repo"
  ansible.builtin.git:
    repo: "{{ automation_repo }}"
    dest: "{{ init_device_temp_path }}"
    version: "{{ automation_repo_branch }}"
  timeout: 180

- name: "Setup ansible: add/update android version"
  ansible.builtin.lineinfile:
      path: "{{ init_device_temp_path }}/roles/axp/{{ sub_model | d(target_model) }}/vars/main.yml"
      regexp: "android_shortversion:.*"
      line: "android_shortversion: {{ git_repo_local_manifests_branch | regex_replace('axp-','') }}"
      state: present
  register: info_added

- name: "Setup ansible: add & push changes"
  ansible.builtin.shell: |
      echo "[GIT][ANSIBLE] starting git commit process" >> {{ BUILD_LOG }}
      source {{ BUILDHOME }}/.divested.vars.{{ sub_model | d(target_model) }}-{{ android_shortversion }}-{{ axp_type | upper() }}
    
      CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)
      if [ $CMTL -gt 0 ];then
          git add -A >> {{ BUILD_LOG }} 2>&1 || CMT=1
          git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "axp: {{ sub_model | d(target_model) }}: added/updated vars" >> {{ BUILD_LOG }} 2>&1
          echo "[GIT][ANSIBLE] git commit done" >> {{ BUILD_LOG }}

          CURHASH=$(git log -1 --format=oneline | cut -d ' ' -f1)
          REMHASH=$(git log --pretty=oneline --decorate | grep "origin/{{ git_repo_local_manifests_branch }}" |cut -d ' ' -f1)
            
          if [ "$CURHASH" != "$REMHASH" ]; then
              echo "[GIT][ANSIBLE] pushing required ($CURHASH != $REMHASH)!" >> {{ BUILD_LOG }}
              git push origin {{ automation_repo_branch }} >> {{ BUILD_LOG }} 2>&1
          else
              echo "[GIT][ANSIBLE] pushing skipped ($CURHASH == $REMHASH)!" >> {{ BUILD_LOG }}
          fi
      else
           echo "[GIT][ANSIBLE] git commit skipped (no changes)" >> {{ BUILD_LOG }}
      fi
  args:
      chdir: "{{ init_device_temp_path }}"
      executable: /bin/bash
  when: info_added.changed
    
- name: "Setup ansible: End clean"
  ansible.builtin.file:
      path: "{{ init_device_temp_path }}"
      state: absent
