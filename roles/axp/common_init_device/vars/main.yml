---

build_id: "init_device"
target_model: "{{ build_id }}"
telegram_notifications: false

init_device_website_repo: "ssh://git@code.binbash.rocks:22443/AXP.OS/axpos-org.git"
init_device_website_branch: "hugo"
init_device_website_repo_name: "axpos-org"

init_device_vendorfirmware: "ssh://git@code.binbash.rocks:22443/AXP.OS/vendor_firmware.git"

init_device_otaverifier_repo: "git@github.com:sfX-android/update_verifier.git"

android_version: "{{ git_repo_local_manifests_branch | regex_replace('axp-a', '') }}"

####### gitea action workflow triggering

git_axpos_actions_workflow_repo: actions
git_axpos_actions_workflow_id: activate_mirror.yaml
git_axpos_actions_workflow_repo_branch: main

git_axpos_website_workflow_repo: axpos-org
git_axpos_website_workflow_id: pages.yaml
git_axpos_website_workflow_force: false
git_axpos_website_workflow_repo_branch: hugo

######## defaults

skip_dl_cve_checker: true
skip_dl_git_cli_tools: true
skip_setup_otaverify: false
skip_setup_repos: false
skip_setup_firmware: false
skip_setup_firmware_fetch: false
skip_setup_firmware_clean: false
skip_setup_manifest: false
skip_setup_ansible: false
skip_setup_website: false
skip_setup_semaphore: false
skip_mirror_activation: false

########### generate-4-ALL vars

parse_roles_subdir: axp  # roles/xxx to parse
generate_factory_image: false
model_exclusions: "common|j5y17lte|klte|h815|g4"

############ semaphore

semaphore_api_uri: "http://127.0.0.1:8153/api"

# Variables used to create a new task template

semaphore_aos_template_project_id: 6                     # Project "AXP.OS"
semaphore_aos_template_inventory_id: 29                  # Inventory "axp_build_inventory"
semaphore_aos_template_repo_id: 9                        # Repository "sfX-android/automation_scripts"
semaphore_aos_template_vaultkey_id: 21                   # Key Store "vault_pw"
semaphore_aos_template_view_id: 37                       # View: "AOS WIP"
semaphore_aos_template_desc: "{{ template_desc | d('') }}" # Template Description
semaphore_aos_template_playbook: "plays/build.yml"        # playbook to attach to
semaphore_aos_template_parent_name: "BUILD-ID: available versions"

# survey vars
semaphore_aos_template_survey_vars: >-
    [
      {
        "name": "override_clean_basic",
        "title": "clean ZIPs (true* | false)?",
        "required": false,
        "type": "enum",
        "description": "",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "true"
      },
      {
        "name": "override_clean_out",
        "title": "clean build (true* | false)?",
        "required": false,
        "type": "enum",
        "description": "",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "true"
      },
      {
        "name": "override_reset_git",
        "title": "reset all projects & resync (true* | false)?",
        "required": false,
        "type": "enum",
        "description": "",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "true"
      },
      {
        "name": "override_release_build",
        "title": "release the build (true* | false)?",
        "required": false,
        "type": "enum",
        "description": "",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "true"
      },
      {
        "name": "debug_build",
        "title": "private notify (true* | false)?",
        "required": false,
        "type": "enum",
        "description": "true | false",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "true"
      },
      {
        "name": "axp_build_eng",
        "title": "Engineering Build (true | false*)?",
        "description": "will create a debug eng build",
        "required": false,
        "type": "enum",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "false"
      },
      {
        "name": "unstable_build",
        "title": "unstable build (true* | false)?",
        "required": false,
        "type": "enum",
        "description": "true | false",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "true"
      },
      {
        "name": "update_vendor_firmware",
        "title": "Download & Update firmware (yes|no*)?",
        "type": "enum",
        "description": "vendor_firmware_download_url etc must be set",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "false"
      },
      {
        "name": "generate_factory_image",
        "title": "Generate a fastboot flashable factory image?",
        "description": "device vars must be set properly",
        "required": false,
        "type": "enum",
        "values": [
          {
            "name": "yes",
            "value": "true"
          },
          {
            "name": "no",
            "value": "false"
          }
        ],
        "default_value": "false"
      },
      {
        "name": "commit_push",
        "title": "commit_push",
        "required": true,
        "type": "enum",
        "values": [
            {
                "name": "yes",
                "value": "true"
            },
            {
                "name": "no",
                "value": "false"
            }
        ],
        "default_value": "true"
    }
    ]

# vaults
semaphore_aos_template_vaults: >-
    [{
      "name": "main",
      "vault_key_id": {{ semaphore_aos_template_vaultkey_id }},
      "type": "password",
      "script": null
    }]
