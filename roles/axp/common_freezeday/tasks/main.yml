---

- name: "Include loop"
  ansible.builtin.include_tasks: loop.yml
  when: not skip_build_apps

- name: "Include loop"
  ansible.builtin.include_tasks: loop.yml
  vars:
    freezeday_app_repos: "{{ freezeday_app_repos_longrun }}"
  when: not skip_build_apps_longrun

- name: "Include setup semaphore"
  ansible.builtin.include_tasks: setup_semaphore.yml
  when: skip_setup_semaphore is undefined
