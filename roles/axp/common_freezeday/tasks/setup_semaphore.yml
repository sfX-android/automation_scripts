---
# https://semaphoreui.com/api-docs/#/

- name: "Setup semaphore: get current semaphore templates"
  connection: local
  ansible.builtin.uri:
    url: "{{ semaphore_api_uri }}/project/{{ semaphore_aos_template_project_id }}/templates"
    method: GET
    headers:
        Content-Type: application/json
        Authorization: "Bearer {{ vault_semaphore_api_aos_rw }}"
  register: sp_all_templates
  #no_log: true

- name: "Setup semaphore: update semaphore template (if required)"
  connection: local
  ansible.builtin.uri:
    url: "{{ semaphore_api_uri }}/project/{{ semaphore_aos_template_project_id }}/templates/{{ semaphore_aos_template_template_id }}"
    method: PUT
    headers:
        Content-Type: application/json
        Authorization: "Bearer {{ vault_semaphore_api_aos_rw }}"
    body_format: json
    body: >-
        { "project_id": {{ semaphore_aos_template_project_id }},
        "inventory_id": {{ semaphore_aos_template_inventory_id }},
        "repository_id": {{ semaphore_aos_template_repo_id }},
        "environment_id": {{ semaphore_aos_template_env_id }},
        "view_id": {{ semaphore_aos_template_view_id }},
        "name": "{{ semaphore_aos_template_name }}",
        "app": "ansible",
        "playbook": "{{ semaphore_aos_template_playbook }}",
        "description": "{{ semaphore_aos_template_desc }}",
        "arguments": "[]",
        "survey_vars": {{ semaphore_aos_template_survey_vars }},
        "start_version": "{{ semaphore_aos_template_startversion }}",
        "vaults": {{ semaphore_aos_template_vaults }},
        "type": "build",
        "allow_override_args_in_task": false }
    status_code: [ 201, 200 ]
  register: tmplc
  changed_when: tmplc.status == 201
  when: 
    - semaphore_aos_template_name in sp_all_templates.json | map(attribute='name') | list
    - semaphore_aos_template_startversion in sp_all_templates.json | map(attribute='start_version') | list
  #no_log: true
