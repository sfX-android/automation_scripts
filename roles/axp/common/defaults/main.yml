---

# git stuff
axp_git_org: "git@git.disroot.org:AXP.OS"
axp_git_repo: "{{ axp_git_org }}/build.git"
axp_main_branch: axp
# main LOS manifest
git_repo_main_manifests: "https://github.com/LineageOS/android.git"
# the organization name within git(ea):
git_axpos_org_name: "AXP.OS"
# always push changes for reproducible builds
commit_push: True
# just push changes after patching, skip build
just_git_push: False

# codeberg
# tea login add --name NNNN --ssh-key XXXXX --url https://codeberg.org --token XXXXX
#git_axpos_org_public_login: codeberg    # --name NNNN
#git_axpos_org_public_host: "codeberg.org"
#git_axpos_org_public: "ssh://git@{{ git_axpos_org_public_host }}/{{ git_axpos_org_name | regex_replace('\\.', '-') }}"

# disroot
# tea login add --name NNNN --ssh-key XXXXX --url https://git.disroot.org --token XXXXX
git_axpos_org_public_login: disrootorg    # --name NNNN
git_axpos_org_public_host: "git.disroot.org"
git_axpos_org_public: "ssh://git@{{ git_axpos_org_public_host }}/{{ git_axpos_org_name }}"

# binbash
# tea login add --name NNNN --ssh-key XXXXX --url https://code.binbash.rocks --token XXXXX
git_axpos_org_private_login: axpos    # --name NNNN
git_axpos_org_private_host: "code.binbash.rocks"
git_axpos_org_private_manifestremote: "axp.os-private-BBR" # remote name in the manifest
# private git URI (incl org) for creating/updating repos for AXP.OS
git_axpos_org_private: "ssh://git@{{ git_axpos_org_private_host }}:22443/{{ git_axpos_org_name }}"
# comma separated list of private repos within the AXP.OS org.
# reasons for listing them here are e.g. they get rejected on github, containing proprietary stuff or similiar.
# DEPRECATED! handled via ci/cd since the full move to BBR
git_private_repos: "platform_prebuilts_tools,android_cts"
# git / gpg signing key, defaults to empty (is set via Semaphore inventory)
#release_gpg_signing_key: "FE4B2FA2B225F0AB903AF4136740E645718A8E47"
release_gpg_signing_keys_links: >-
    \([key](https://axpos.org/axpos_signing.key), [mirror1](https://codeberg.org/AXP-OS/axpos-org/src/branch/hugo/static/axpos_signing.key), [mirror2](https://leech.binbash.rocks:8008/axp/axpos_signing.key), [mirror3](https://keyserver.ubuntu.com/pks/lookup?search=FE4B2FA2B225F0AB903AF4136740E645718A8E47&fingerprint=on&op=index), [mirror4](https://keys.openpgp.org/search?q=FE4B2FA2B225F0AB903AF4136740E645718A8E47)\)

# pixel kernels (graphene)
#git_pixel_kernel_dir: "{{ android_build_path }}/kernel_google_common"
#git_pixel_kernel_source: "{{ git_pixel_kernel_dir }}/aosp"
#git_pixel_kernel_manifest: https://github.com/GrapheneOS/kernel_manifest-pixel.git
#git_repo_local_manifests: "{{ git_axpos_org_public }}/manifest"
#git_repo_local_manifests_branch: "{{ ROM_FLAVOR }}-{{ android_shortversion }}"

# pixel kernels (google)
git_pixel_kernel_dir: "{{ android_build_path }}/google_kernel_source"
git_pixel_kernel_source: "{{ git_pixel_kernel_dir }}/aosp"
git_pixel_kernel_manifest: "https://android.googlesource.com/kernel/manifest"
#git_repo_local_manifests: "{{ axp_git_org }}/manifest"
#git_repo_local_manifests: "git@{{ git_axpos_org_public_host }}/{{ git_axpos_org_name | regex_replace('\\.', '-') }}/manifest.git"
git_repo_local_manifests: "{{ git_axpos_org_public }}/manifest"
git_repo_local_manifests_branch: "{{ ROM_FLAVOR }}-{{ android_shortversion }}"


# set kernel default for pixel vs. non-pixel
pixel_kernel_gki: >-
    {% if target_model_vendor | d('undef') == "Google" and android_version_int | int > 14 %}True{% else %}False{% endif %}

# CONFIG_LOCALVERSION cannot be easily managed anymore with KLEAF.
# instead we will modify the stamp config which empties it otherwise. there are (maybe) better ways to achieve
# this but I was not able to find any and this seems to work:
pixel_kernel_defconfig: >-
    {% if pixel_kernel_gki | bool %}{{ git_pixel_kernel_dir }}/build/kernel/kleaf/impl/stamp.bzl{% endif %}

# the login name used in "tea login add" command, you will get the full command in the ansible error.
# see: roles/axp/common/tasks/prep.yml for details
# DEPRECATED: use git_axpos_org_private_login
gitea_login_name: "{{ git_axpos_org_private_login }}"

# Gitea CLI tool
# create a personal access token for a bot user. must have at least these permissions:
#    write:organization
#    write:repository
#    read:user
#    repo
#    admin:public_key
gitea_cli_version: '0.10.1'
gitea_cli_download_uri: "https://gitea.com/gitea/tea/releases/download/v{{ gitea_cli_version }}/tea-{{ gitea_cli_version }}-linux-amd64"    # xz is not supported by unarchive
gitea_cli_main_host: code.binbash.rocks

# Github CLI tool
# create a personal access token for a bot user. must have at least these permissions:
#    write:organization
#    write:repository
#    read:user
#    repo
#    admin:public_key
github_cli_version: '2.76.0'
github_cli_download_uri: "https://github.com/cli/cli/releases/download/v{{ github_cli_version }}/gh_{{ github_cli_version }}_linux_amd64.tar.gz"
github_cli_main_host: github.com

# build vars
os_name: "AXP.OS"
#los_version: "{{ android_shortversion | replace('a13','20.0') | replace('a12','19.1') | replace('a11','18.1') | replace('a10','17.1') | replace('a9','16.0') }}"
#git_repo_main_branch: "lineage-{{ los_version }}"
git_repo_main_branch: "{{ los_version_gitbranch }}"
#DOSPATH: "/home/androidsource/do-not-touch/{{ ROM_FLAVOR }}"
#DOSPATH: "/ssd2/androidsource/do-not-touch/{{ ROM_FLAVOR }}"
DOSPATH: "/ssd2/aos"
# SRCPATH HAS TO be part of DOSPATH - this is a divestOS limitation and cannot be changed
# If you need to use a different path for any reason you can use symlinks for the "LineageOS-XX" folders
# but ensure you leave the directory structure intact then
SRCPATH: "{{ DOSPATH }}/Build/LineageOS-{{ los_version }}"
dos_release_dir: "{{ zipdir_mntp }}/{{ axp_type | d('axp') }}/zips/{{ target_model }}"
axp_finalzip_dir: "{{ dos_release_dir }}/LineageOS-{{ los_version }}/release_keys/"
ZIPDIR: "{{ axp_finalzip_dir }}"
USE_CCACHE: 1
rempath: "/home/nightlies/roms/{{ ROM_FLAVOR }}/{{ sub_model | d(target_model) }}/"
RELEASE_TYPE: >-
    {%if axp_type is undefined %}dos{% else %}{{ axp_type | upper() }}{% endif %}
ROM_VERSION: "{{ build_id }}"
PREFIXFNAME: "{{ os_name }}-{{ los_version }}"
axp_recovery_filename: "{{ PREFIXFNAME }}-RECOVERY-{{ build_id }}.img"
# if set to true (in your env or anywhere else) an -eng build will be created instead of a -user one
# moved to global common
#axp_build_eng: false

# directories to be cleaned on a clean build
axp_clean_paths:
    - "{{ SRCPATH }}/kernel" 
    - "{{ SRCPATH }}/DOS_PATCHED_FLAG"
    - "{{ SRCPATH }}/packages/apps/Fennec_DOS-Shim"
    - "{{ SRCPATH }}/vendor/divested"
    - "{{ SRCPATH }}/vendor/fdroid_prebuilt"
    - "{{ SRCPATH }}/packages/apps/SupportDivestOS"
    - "{{ SRCPATH }}/vendor/oneplus"
    - "{{ SRCPATH }}/vendor/samsung"
    - "{{ SRCPATH }}/hardware/oplus"
    - "{{ SRCPATH }}/hardware/samsung"
    - "{{ SRCPATH }}/external/firebase-messaging"
    - "{{ SRCPATH }}/device"
    - "{{ SRCPATH }}/vendor/axp"


# Bootloader ID (first line) for verifying build log
# this MUST be set per device, the following are just for the case if no AVB is used at all
# and can be anything, as long as it appears in the log and only once
axp_bootloader_id_pro: 'You should find your build here'
axp_bootloader_id_slim: 'You should find your build here'

# set bootloader id for the current build process depending on the AXP.OS flavor
axp_bootloader_id: >-
    {% if axp_type | d(ROM_FLAVOR) == "slim" %}{{ axp_bootloader_id_slim }}{% else %}{{ axp_bootloader_id_pro }}{% endif %}

# android testkey hashes (https://github.com/LineageOS/android_build/tree/lineage-22.2/target/product/security)
android_signing_testkey: cdbb77177f731920bbe0a0f94f84d9038ae0617d
android_signing_testkey_verity: e8eb784d2f4d54917a7bb33bdbe76967e4d1e433

# disable/enable low-end device (optimize for performance, increase storage, lower avb hashsums)
# override in device vars if required
axp_lowend_device: False

# set force encryption (ICE, FDE, FBE), disable in device vars if required, will set AXP_AUTO_ENCRYPT
axp_auto_encrypt: True

# AVB / Verified Boot
axp_avb_version: 2 # AVB v1 or v2, override in the device vars where required. to disable set it to 0.
vbmeta_verify: True # DEPRECATED! handled by axp_avb_version + skip_avb_boot_verify. verify all build images via the created vbmeta.img?
# enable/disable based on version set. sets AXP_ENABLE_AVB which enforces enabling(!) AVB
axp_enable_avb: >-
    {% if axp_avb_version == 0 %}'false'{% else %}'true'{% endif %}
#axp_enable_avb_handling: 'true' # axp_enable_avb_handling is deprecated. sets AXP_ENABLE_AVB_HANDLING which applies all AXP.OS configs like increasing key sizes etc
axp_avb_algorithm: "SHA512_RSA4096" # sets BOARD_AVB_ALGORITHM (warning: must match the created AVB key!)
axp_avb_hashtree_algorithm: default # sets AXP_HASHTREE_ALGORITHM (can be one of: default,sha1,sha256,sha512. "default" depends on AXP_LOWEND_DEVICE)
axp_avb_buildarg: >-
    {% if axp_avb_version == 1 %}verity{% endif %}
AVB_VERSION: "{{ axp_avb_version }}"
# for AVB 1, some devices might not sign boot images, override in device vars if required
skip_avb_boot_verify: False

# common search strings used to parse the log after building.
# when overriding these, copy the WHOLE part of this to a device vars yml.
# a default override exists if a device has "axp_lowend_device: True" set (see axp_lowend_device.vars.yml).
# search: regex string to search for (using: "grep -oE")
# expect: a (non-regex!) string expected as a result
# (usally you search for something you do NOT want to see in the log and expect an EMPTY result then)
parselogerr:
    - search: 'key .*/testkey.*.pem' # ALWAYS COPY THIS! we NEVER EVER want something signed with a testkey
      expect: ''
    - search: '{{ android_signing_testkey }}' # ALWAYS COPY THIS! we NEVER EVER want something signed with a testkey
      expect: ''
    - search: '{{ android_signing_testkey_verity }}' # ALWAYS COPY THIS! we NEVER EVER want something signed with a testkey
      expect: ''
    - search: 'Algorithm:.*{{ axp_avb_algorithm }}' # AVB only: the AVB key algo should be axp_avb_algorithm
      expect_cnt: 1
    - search: "{{ axp_bootloader_id }}" # AVB only: Check the device's bootloader ID (if AVB / vbmeta_verify is on)
      expect_cnt: 1
    - search: 'Hash Algorithm:.*sha(1|256)' # AVB only: fail if vbmeta hash algo found (info_image) but not the expected KEYS_HASHTYPE
      expect: ''
    - search: 'Successfully verified sha(1|256) hash of' # AVB only: fail if vbmeta verify found (verify_image) but not the expected KEYS_HASHTYPE
      expect: ''

# allow to (manually) set selinux permissive
axp_allow_permissive: False

# kernel patching
divest_unsupported_device: false    # should be overwritten in a device's vars/main.yml if needed
unsupported_device_kernel_patch: true    # enable kernel patching by default, overwrite in semaphore if needed

# translated device tree path
target_model_device_tree_path: "device/{{ target_model_vendor | lower }}/{{ target_model }}"

# translated common tree file path
target_model_common_tree_path: "{{ target_model_common_tree | regex_replace('_','/') }}"

# regular makefile name within a device tree, required e.g. for switch_major_release
target_model_device_tree_mk: device.mk

# the BoardConfig file within a device tree, required e.g. for switch_major_release
# usually is one of: BoardConfigCommon, BoardConfig, BoardConfigLineage.
# defaults to BoardConfigCommon
target_model_device_tree_boardmk: BoardConfigCommon.mk

# extendrom stuff
use_extendrom: "true"
extendrom_packages_skip_dl: 'false'
extendrom_package_list_common: "AOSmium_webview64 additional_repos.xml AuroraStore F-Droid noeSpeakNG noDefaultBrowserWebView Etar_ER FossifyGallery_FD"
extendrom_package_list_default: "{{ extendrom_package_list_common }} GsfProxy_GH Magisk MicrogGmsCore_GH Phonesky_AXP-OS {% if android_version_int | int > 14 %}AOSLauncher{% else %}NeoLauncher-latest{% endif %}"
extendrom_fdroid_repos: "axpos.xml molly.xml nailyk.xml threema.xml futo_org.xml cromite.xml ironfox.xml izzysoft.xml"
extendrom_preroot_boot: "true"
extendrom_signature_spoofing: "true"
#extendrom_sigspoof_force_dir: "vendor/extendrom/config/sigspoof/{{ ROM_FLAVOR }}/{{ android_shortversion | upper() }}"
#sh: export EXTENDROM_SIGSPOOF_FORCE_PDIR={{ extendrom_sigspoof_force_dir }}
extendrom_patcher_reset: "false"  # as this would reset divest patches (e.g. boot animation)
extendrom_boot_debug: "true"
extendrom_signing_patches: 'true'
# enable installation source interception
#extendrom_intercept_installsrc: 'true'
# disable call restrictions
extendrom_allow_any_call_recording: 'true'

# Signing keys configuration
KEYS_CERT_DAYS_VERITY: 10950 # some devices do not like if the expire date is long time in the future!! (e.g. dumpling) set in device vars if the default of 30 years avoid booting!
KEYS_CERT_C: DE
KEYS_CERT_O: "The AXP.OS Project"
KEYS_CN: "{{ target_model }}"
KEYS_CERT_OU: "{{ axp_type | d('pro') }}"
KEYS_SIZE: 8192
KEYS_HASHTYPE: sha512
keysdir: "{{ keys_base_path }}/{{ os_name }}/{{ sub_model | d(target_model) }}"
# ensure we use our common apps key used to signed our own apps (e.g. Phonesky)
common_apps_keydir: "{{ keys_base_path }}/{{ os_name }}/common"

# notification vars
build_tag: "{{ ansible_date_time.year }}-{{ ansible_date_time.month }}-{{ ansible_date_time.day }}_{{ target_model }}_{{ android_shortversion }}"

device_cl: |-
  ***{{ target_model_full | regex_escape() }}*** ***\({{ target_model | regex_escape() }}\)*** \- ***{{ ROM_FLAVOR | regex_escape() | upper }}***

rom_cl: |-
  ***Changes:***
  \- AXP\.OS: [Changelog](https://axpos.org/Changelog)

dl_links: |-
  ***Download:*** [{{ ROMFILE.stdout | regex_escape() }}]({{ leech_server }}/{{ ROM_FLAVOR }}/{{ target_model }})

ota_hint: |-
  ***OTA Update:*** supported

# Divest has some very weird behavior as it is only compatible with fedora officially
# one of the reasons is that /bin/sh points to /bin/bash there and divest uses /bin/sh
# everywhere(no idea why!) and another example is the tool "rename" which is different
# in fedora then in other distros (at least Ubuntu). The following fixes all known issues
# with divest due to its non-standard behavior and inits DOS as it should be
DOS_INIT: |
    echo "BUILDHOME: {{ BUILDHOME }}"
    export HOME="{{ BUILDHOME }}" && echo "home set to $HOME" >> {{ BUILD_LOG }}
    export BDEVICE="{{ target_model }}"
    export PATH="{{ BUILDHOME }}/.local/bin:$HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    export TMPDIR="{{ server_tmp_dir }}"
    if [ ! -L "$HOME/.local/bin/sh" ];then ln -s /bin/bash $HOME/.local/bin/sh; fi
    if [ ! -L "$HOME/.local/bin/rename" ];then ln -s {{ SRCPATH }}/rename $HOME/.local/bin/rename; fi
    alias sh=/bin/bash
    alias rename="{{ SRCPATH }}/rename"
    {% if release_gpg_signing_key is defined and release_gpg_signing_key != '' %}
    gpg --list-secret-keys >> {{ BUILD_LOG }} 2>&1 || true
    {% endif %}

    cd {{ SRCPATH }}
    source build/envsetup.sh >> {{ BUILD_LOG }} 2>&1 && echo "sourcing envsetup: success" >> {{ BUILD_LOG }}
    source {{ DOSPATH }}/Scripts/init.sh >> {{ BUILD_LOG }} 2>&1 && echo "sourcing init: success" >> {{ BUILD_LOG }}

    # set target release (see common/defaults)
    {% if android_target_release != "0" %}export TARGET_RELEASE={{ android_target_release }} brf_suffix="-{{ android_target_release }}"{% endif %}

    # set advanced deblobbing on A15 and later
    if [ {{ android_version_int }} -ge 15 ]||[ "{{ target_model }}" == "g4" ];then
        export AXP_ADVANCED_DEBLOB=true
    else
        unset AXP_ADVANCED_DEBLOB
    fi

# we do not want to generate a fastboot factory image by roles/common/defaults/main.yml
# override "generate_factory_image" in semaphore if needed
generate_factory_image: False

# get & upload a recovery image
axp_release_recovery: False

# should we start the vendor firmware updater? should be overwritten in SEMAPHORE if required
update_vendor_firmware: False

# override in semaphore, DEPRECATED, use update_vendor_firmware instead
download_fairphone_firmware: False

# does factory zip contains super image? should be overwritten in device vars if required
vendor_firmware_super_img: False

# enable the following in a device's vars file with:
# custom_build_command: "{{ SH_COMMON_FAIRPHONE_CREATE_FACTORY }}"
# and set "generate_factory_image: True" to actually generate it (in semaphore)
SH_COMMON_FAIRPHONE_CREATE_FACTORY: |
        {% if axp_build_eng | bool %}
        #mka sepolicy
        buildDeviceDebug {{ target_model }} || f_detect_kerr
        {% else %}
        buildDevice {{ target_model }} || f_detect_kerr
        {% endif %}
        {% if generate_factory_image | bool %}

        # cleanup
        if [ -f {{ SRCPATH }}/out/{{ os_name }}-${VERSION}-factory.zip ];then rm -vf {{ SRCPATH }}/out/{{ os_name }}-${VERSION}-factory.zip;fi
        if [ -f {{ SRCPATH }}/out/${FZIP}-factory.zip ]; then rm -vf {{ SRCPATH }}/out/${FZIP}-factory.zip;fi
        if [ -d {{ SRCPATH }}/out/{{ target_model }}-factory/ ];then rm -rf {{ SRCPATH }}/out/{{ target_model }}-factory/;fi
        
        # extract the origin factory zip
        unzip {{ SRCPATH }}/out/{{ target_model }}-factory.zip -d {{ SRCPATH }}/out/{{ target_model }}-factory > /dev/null
        IMAGES_PATH=images
        export FPIMGPATH=$(dirname {{ SRCPATH }}/out/{{ target_model }}-factory/*/images/)/$IMAGES_PATH
       
        # extract AXP.OS factory zip and override Fairphone images by AOS ones
        REPLHASH=$(zipinfo -1 {{ SRCPATH }}/out/target/product/{{ target_model }}/${FZIP}-fastboot.zip '*.img')
        unzip -o {{ SRCPATH }}/out/target/product/{{ target_model }}/${FZIP}-fastboot.zip -d ${FPIMGPATH} '*.img' > /dev/null

        # ... and replace some non-standard ones with AOS ones
        # FIXME!
        if [ -f "${FPIMGPATH}/super_system.img" ];then
            mv -v ${FPIMGPATH}/system.img ${FPIMGPATH}/super_system.img
            REPLHASH=$(echo "$REPLHASH" | sed "s/system.img/super_system.img/g" )
        fi
        if [ -f "${FPIMGPATH}/super_vendor.img" ];then
            mv -v ${FPIMGPATH}/vendor.img ${FPIMGPATH}/super_vendor.img
            REPLHASH=$(echo "$REPLHASH" | sed "s/vendor.img/super_vendor.img/g" )
        fi
        
        avb_file="{{ target_model }}_AXP.OS_avb_pkmd.bin"
        if [ "{{ axp_type }}" == "slim" ];then avb_file="{{ target_model }}_AXP.OS-slim_avb_pkmd.bin";fi
        cp {{ SRCPATH }}/user-keys/avb_pkmd.bin ${FPIMGPATH}/$avb_file
        croot
        
        # add flashing-cmd for the AXP.OS avb key
        cd ${FPIMGPATH} && cd ..
        f=$(echo flash_fp*.command)
        awk '{print} /^flash_device$/ && !n {print "sleep 5\n'"\${FASTBOOT_BIN}"' erase avb_custom_key\n'"\${FASTBOOT_BIN}"' flash avb_custom_key '\${IMAGES_DIR}'/'"$avb_file"'\n'"\${FASTBOOT_BIN}"' reboot-bootloader"; n++}' ${f} > ${f}.tmp && mv -v ${f}.tmp ${f} && chmod +x ${f}
        
        # do not auto-lock by default
        sed -i 's/^RELOCK_BOOTLOADER=.*/RELOCK_BOOTLOADER="false"/g' $f
        
        # update checksums
        for hfile in $REPLHASH;do
            echo "generating hash for: $hfile"
            newhash=$(sha256sum $IMAGES_PATH/$hfile | cut -d ' ' -f 1)
            sed -E "s#^(.*){64,}(\s)(.*$IMAGES_PATH/$hfile)#$newhash\2\3#g" -i SHA256SUMS
        done
        # add command file
        CMDHASH=$(sha256sum $f | cut -d ' ' -f1)
        sed -E "s#^(.*){64,}(\s)(.*$f)#$CMDHASH\2\3#g" -i SHA256SUMS
        
        # test checksums
        sha256sum --check SHA256SUMS
        
        # test vbmeta
        croot
        out/host/linux-x86/bin/avbtool info_image --image ${FPIMGPATH}/vbmeta.img
        out/host/linux-x86/bin/avbtool verify_image --follow_chain_partitions --image ${FPIMGPATH}/vbmeta.img

        # re-package it
        cd {{ SRCPATH }}/out/{{ target_model }}-factory/
        zip -r ../${FZIP}-factory.zip .
        cd ..
        sha512sum ${FZIP}-factory.zip > ${FZIP}-factory.zip.sha512
        mv -v ${FZIP}-factory.zip* {{ ZIPDIR }}/target_files/
        FZIPINF="\n\tand the FACTORY zip here: {{ ZIPDIR }}/target_files/${FZIP}-factory.zip\n"
        cd {{ SRCPATH }}
        {% endif %}

# enable the following in a device's vars file with:
# custom_build_command: "{{ SH_COMMON_PIXEL_CREATE_FACTORY }}"
# generate_factory_image: True (in semaphore)
SH_COMMON_PIXEL_CREATE_FACTORY: |
    {% if axp_build_eng | bool %}
    #mka sepolicy
    buildDeviceDebug {{ target_model }} || f_detect_kerr
    {% else %}
    buildDevice {{ target_model }} || f_detect_kerr
    {% endif %}
    {% if generate_factory_image | bool %}

    echo "Creating FACTORY ZIP!" >> {{ BUILD_LOG }}
    
    if [ -f "{{ vendor_factory_persistent_path }}" ];then
        echo "Using previously downloaded factory image: {{ vendor_factory_version }}.zip" >> {{ BUILD_LOG }}
    else
        echo "{{ vendor_factory_version }}.zip not found in: {{ persistent_dir }}, downloading.." >> {{ BUILD_LOG }}
        wget -q {{ vendor_factory_download_url }} -O {{ vendor_factory_persistent_path }} >> {{ BUILD_LOG }} 2>&1 \
          || (wget {{ vendor_factory_download_url }} -O {{ vendor_factory_persistent_path }} >> {{ BUILD_LOG }} 2>&1 ; exit 9)
    fi
    
    VERSION="{{ los_version }}-{{ BUILDIDENT }}-{{ RELEASE_TYPE }}"
    FZIP="{{ os_name }}-${VERSION}-{{ target_model }}"
    FACTORYID="{{ vendor_factory_id }}"

    export FACZIP="{{ vendor_factory_persistent_path }}"
    export ANDROIDSHORTVERSION="{{ android_shortversion }}"
    export CODEN="{{ target_model }}"

    cd out/target/product/{{ target_model }}
    if [ -d factory ];then rm -rf factory;fi

    unzip {{ vendor_factory_persistent_path }} -x "*/image-{{ target_model }}-*.zip" -d factory
    cd factory/{{ target_model }}-${FACTORYID}

    cp ../../${FZIP}-fastboot.zip image-{{ target_model }}-${FACTORYID}.zip     
    cp {{ SRCPATH }}/user-keys/avb_pkmd.bin .
    for f in flash-base.sh flash-all.sh;do
        awk '{print} /fastboot reboot-bootloader/ && !n {print "sleep 5\nfastboot erase avb_custom_key\nfastboot flash avb_custom_key avb_pkmd.bin\nfastboot reboot-bootloader"; n++}' $f > $f.tmp && mv $f.tmp $f && chmod +x $f
    done
    awk '{print} /fastboot reboot-bootloader/ && !n {print "ping -n 5 127.0.0.1 >nul\nfastboot erase avb_custom_key\nfastboot flash avb_custom_key avb_pkmd.bin\nfastboot reboot-bootloader"; n++}' flash-all.bat > bat.tmp && mv bat.tmp flash-all.bat && chmod +x flash-all.bat
    cd ..
    zip -r ../${FZIP}-factory.zip {{ target_model }}-${FACTORYID}
    cd ..
    sha512sum ${FZIP}-factory.zip > ${FZIP}-factory.zip.sha512sum
    
    {% if release_gpg_signing_key is defined and release_gpg_signing_key != '' %}
    echo "GPG signing ${FZIP}-factory.zip.sha512sum with {{ release_gpg_signing_key }}" >> {{ BUILD_LOG }}
    if [ -f "${FZIP}-factory.zip.sha512sum.asc" ]; then rm ${FZIP}-factory.zip.sha512sum.asc; fi
    if gpg --sign --local-user "{{ release_gpg_signing_key }}" --clearsign "${FZIP}-factory.zip.sha512sum"; then
        mv -f "${FZIP}-factory.zip.sha512sum.asc" "${FZIP}-factory.zip.sha512sum" >> {{ BUILD_LOG }} 2>&1
    fi
    {% endif %}

    mv ${FZIP}-factory.zip* {{ ZIPDIR }}/target_files/
    FZIPINF="\n\tand the FACTORY zip here: {{ ZIPDIR }}/target_files/${FZIP}-factory.zip\n"
    cd {{ SRCPATH }}
    {% endif %}

# the build script which will be executed after all the resets, syncs and patching have been done
SH_COMMON_BUILD_SNIPPET: |
    #!/bin/bash
    ####################################################################################################################   
    # be strict on failures
    set -e

    # fix build errors
    export LC_ALL=C
    
    # unset any extendrom var
    er_vars="ENABLE_EXTENDROM EXTENDROM_SIGNING_PATCHES EXTENDROM_SIGNING_FORCE_PDIR EXTENDROM_PACKAGES EXTENDROM_PACKAGES_SKIP_DL EXTENDROM_BOOT_DEBUG EXTENDROM_DEBUG_PATH EXTENDROM_DEBUG_PATH_SIZE_FULL EXTENDROM_DEBUG_PATH_SIZE_CRASH EXTENDROM_DEBUG_PATH_SIZE_KERNEL EXTENDROM_DEBUG_PATH_SIZE_SELINUX EXTENDROM_PREROOT_BOOT EXTENDROM_FDROID_REPOS EXTENDROM_SIGNATURE_SPOOFING EXTENDROM_ALLOW_ANY_CALL_RECORDING EXTENDROM_INTERCEPT_INSTALLSRC EXTENDROM_PATCHER_RESET EXTENDROM_SIGSPOOF_FORCE_PDIR"
    for v in $er_vars;do unset $v;done

    # unset low-end def
    unset AXP_LOWEND_DEVICE
    {% if axp_lowend_device | d(False) %}
    # this is a low-end device (optimize for performance)
    export AXP_LOWEND_DEVICE=True
    {% endif %}

    ########################### BUILD #########################

    {% if git_pixel_kernel_manifest_branch is defined and target_model_vendor == "Google" and ((override_reset_git == "undef" and reset_git | bool) or (override_reset_git | bool) or (override_sync | bool)) %}
    ###### BUILD GOOGLE PIXEL KERNEL
    cd {{ git_pixel_kernel_dir }}
    {{ pixel_kernel_buildcmd | d('echo "Error: missing pixel_kernel_buildcmd def"; false') }} >> {{ BUILD_LOG }} 2>&1
    KERN_REL_DIR=$(grep string_value {{ SRCPATH }}/build/release/flag_values/{{ android_target_release }}/RELEASE_KERNEL_{{ target_model | upper() }}_DIR.textproto | cut -d '"' -f2 | tr -d " " | tail -n1)
    echo "KERN_REL_DIR: >{{ SRCPATH }}/$KERN_REL_DIR<" >> {{ BUILD_LOG }}
    if [ -d "{{ SRCPATH }}/$KERN_REL_DIR" ];then
        cp -av {{ pixel_kernel_buildout }}/* {{ SRCPATH }}/$KERN_REL_DIR/ >> {{ BUILD_LOG }} 2>&1
    else
        echo "ERROR: KERN_REL_DIR DOES NOT EXIST!" >> {{ BUILD_LOG }}
        exit 33
    fi
    cd {{ SRCPATH }}
    {% endif %}

    # setup build env including stupid DOS workarounds
    {{ DOS_INIT }}
    
    # ensure vendor secpatch date is set
    source vendor/firmware/{{ target_model }}/0SOURCE  >> {{ BUILD_LOG }} 2>&1 || true
            
    {% if axp_build_eng | bool %}
    breakfast lineage_{{ sub_model | d(target_model) }}${brf_suffix}-eng >> {{ BUILD_LOG }} 2>&1
    {% else %}
    breakfast lineage_{{ sub_model | d(target_model) }}${brf_suffix}-user >> {{ BUILD_LOG }} 2>&1
    {% endif %}
    
    # CCACHE
    export USE_CCACHE={{ USE_CCACHE }}
    if [ "{{ USE_CCACHE }}" -eq 1 ];then
        export CCACHE_EXEC=/usr/bin/ccache
        export PATH="/usr/lib/ccache/:$PATH"
    {% if CCACHE_COMPRESS == 1 %}
        export CCACHE_COMPRESS={{ CCACHE_COMPRESS }}
    {% else %}
        export CCACHE_NOCOMPRESS=1
        unset CCACHE_COMPRESS
    {% endif %}
        mkdir -p {{ CCACHE_DIR }}
        export CCACHE_DIR="{{ CCACHE_DIR }}"
        {{ CCACHE_EXEC }} --max-size={{ ccache_max_size }}
    fi

    f_detect_kerr(){
        set +e
        resetEnv
        vendor/axp/scripts/find_cve_error.sh --parse -k {{ target_kernel_dir }} -L {{ BUILD_LOG }}
        just_cve_excl=$(grep "PROBLEMATIC_CVES:" {{ BUILD_LOG }} | cut -d ':' -f2- | tr '\n' ' ')

        if [ -n "$just_cve_excl" ];then
            echo -e "\ndirty test: revert CVE's and re-test like:"
            echo -e "\tcd {{ target_kernel_dir }} && for p in $just_cve_excl; do patch -p1 -R < \$DOS_PATCHES_LINUX_CVES/\$p;done; croot; time ~/build_{{ target_model }}_{{ android_shortversion }}_{{ ROM_FLAVOR }}.sh | tee ~/LOG"
            echo -e "\nIf you then encounter another error do:\n\tcat ~/LOG >> {{ BUILD_LOG }}"
            echo -e "\tvendor/axp/scripts/find_cve_error.sh --parse -k {{ target_kernel_dir }} -L {{ BUILD_LOG }}"
        fi
        exit 5
    }

    {% if build_bootimage_only is defined and build_bootimage_only %}
        # just build bootimage (e.g. for kernel patch tests)
        set +e
        resetEnv
        mka bootimage
        if [ $? -ne 0 ];then
            f_detect_kerr
        else
            echo "OK: kernel was build successfully!"
        fi

    {% else %}
    # regular build process

    # extendrom flags
    export ENABLE_EXTENDROM={{ use_extendrom }}
    export EXTENDROM_PACKAGES_SKIP_DL={{ extendrom_packages_skip_dl }}
    export EXTENDROM_PACKAGES="{{ extendrom_package_list | d(extendrom_package_list_default) }}"
    export EXTENDROM_FDROID_REPOS="{{ extendrom_fdroid_repos }}"
    export EXTENDROM_PREROOT_BOOT={{ extendrom_preroot_boot }}
    #export MAGISK_TARGET_ARCH=
    export EXTENDROM_BOOT_DEBUG={{ extendrom_boot_debug }}
    export EXTENDROM_DEBUG_PATH={{ extendrom_debug_path |d (extendrom_debug_path_default) }}
    export EXTENDROM_DEBUG_PATH_SIZE_FULL={{ extendrom_debug_path_size_full | d(extendrom_debug_path_size_full_default) }}
    export EXTENDROM_DEBUG_PATH_SIZE_KERNEL={{ extendrom_debug_path_size_kernel | d(extendrom_debug_path_size_kernel_default) }}
    export EXTENDROM_DEBUG_PATH_SIZE_SELINUX={{ extendrom_debug_path_size_selinux | d(extendrom_debug_path_size_selinux_default) }}
    export EXTENDROM_DEBUG_PATH_SIZE_CRASH={{ extendrom_debug_path_size_crash | d(extendrom_debug_path_size_crash_default) }}
    export EXTENDROM_SIGNATURE_SPOOFING={{ extendrom_signature_spoofing }}
    export EXTENDROM_PATCHER_RESET={{ extendrom_patcher_reset }}
    export EXTENDROM_SIGNING_PATCHES={{ extendrom_signing_patches }}
    export EXTENDROM_ALLOW_ANY_CALL_RECORDING={{ extendrom_allow_any_call_recording }}
    export EXTENDROM_INTERCEPT_INSTALLSRC={{ extendrom_intercept_installsrc | d('false') }}
    # execute extendrom
    $PWD/vendor/extendrom/er.sh

    echo "[GIT] checking kernel changes in {{ target_kernel_dir }}"
    # add unstaged changes
    CMT=0
    cd {{ target_kernel_dir }}
    git add -A || CMT=1
    # check for uncommitted changes
    CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)
    # commit if required
    if [ $CMT -eq 1 -o $CMTL -gt 0 ];then 
        git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "uncatched scripted change(s)"
        echo "[GIT] committed scripted kernel changes for {{ target_kernel_dir }}" >> {{ BUILD_LOG }}
    fi
    git status
    croot
    
    # build
    #resetEnv
    {%   if android_version_int | int >= 15   %}
    {%      if (override_reset_git == "undef" and reset_git | bool) or (override_reset_git | bool) or (override_sync | bool)   %}
    # as we patch bionic/libc ABI reference updates are required
    $ANDROID_BUILD_TOP/development/vndk/tools/header-checker/utils/create_reference_dumps.py --lib libc --lib-variant APEX --release $TARGET_RELEASE --product lineage_{{ target_model }} --build-variant user
    $ANDROID_BUILD_TOP/development/vndk/tools/header-checker/utils/create_reference_dumps.py --lib libc --lib-variant LLNDK --release $TARGET_RELEASE --product lineage_{{ target_model }} --build-variant user
    {%      endif      %}
    {%   endif   %}

    #### LEGACY PYTHON #########################
    case {{ android_shortversion }} in
        a9|a10) source ~/.venv/python2/bin/activate ;;
    esac

    {%   if axp_build_recovery_only is defined and axp_build_recovery_only   %}
    mka recoveryimage || f_detect_kerr
    if [ ! -d {{ ZIPDIR }} ]; then mkdir -p {{ ZIPDIR }};fi
    mv -v out/target/product/{{ target_model }}/recovery.img {{ ZIPDIR }}/{{ axp_recovery_filename }}
    {%   elif custom_build_command is defined   %}
    # custom_build_command defined!
    # generate_factory_image: {{ generate_factory_image }}
    {{ custom_build_command }}
    {%   elif axp_build_eng | bool   %}
    # axp_build_eng set!
    #mka sepolicy
    #mka selinux_policy (if A15)
    buildDeviceDebug {{ target_model }} {{ axp_avb_buildarg }} || f_detect_kerr
    {%   else %}
    buildDevice {{ target_model }} {{ axp_avb_buildarg }} || f_detect_kerr
    {%   endif   %}

    # enforce fail detect on verify
    set -e

    {%   if axp_avb_version == 2   %}
    # See: https://source.android.com/docs/security/features/verifiedboot/boot-flow 
    FPID=$(cat user-keys/avb_pkmd.bin | openssl dgst -sha256 | cut -d "=" -f 2 | tr -d " " | tr "[[:lower:]]" "[[:upper:]]")
    echo -e "\nBOOTLOADER minimal ID (AVB 2)"
    echo -e "\t${FPID:0:8}\n"
    echo -e "BOOTLOADER full ID:"
    echo -e "\t${FPID:0:16}"
    echo -e "\t${FPID:16:16}"
    echo -e "\t${FPID:32:16}"
    echo -e "\t${FPID:48:16}\n"

    {%      if vbmeta_verify      %}
    echo "[AVB2-VERIFY] ... checking verified boot chain"
    out/host/linux-x86/bin/avbtool info_image --image out/target/product/{{ target_model }}/vbmeta.img 2> /dev/null || true
    out/host/linux-x86/bin/avbtool verify_image --follow_chain_partitions --image out/target/product/{{ target_model }}/vbmeta.img 2> /dev/null \
        || (out/host/linux-x86/bin/avbtool info_image --image out/target/product/{{ target_model }}/obj/PACKAGING/target_files_intermediates/lineage_{{ target_model }}-target_files*/IMAGES/vbmeta.img;\
            out/host/linux-x86/bin/avbtool verify_image --follow_chain_partitions --image out/target/product/{{ target_model }}/obj/PACKAGING/target_files_intermediates/lineage_{{ target_model }}-target_files*/IMAGES/vbmeta.img)
    {%      endif      %}
    {%   elif axp_avb_version == 1 %}
    FPID=$(cat user-keys/verity.x509.der | openssl dgst -sha256 | cut -d "=" -f 2 | tr -d " " | tr "[[:lower:]]" "[[:upper:]]")
    echo -e "\nBOOTLOADER minimal ID (AVB 1)"
    echo -e "\t${FPID:0:8}\n"
    echo -e "BOOTLOADER full ID:"
    echo -e "\t${FPID:0:16}"
    echo -e "\t${FPID:16:16}"
    echo -e "\t${FPID:32:16}"
    echo -e "\t${FPID:48:16}\n"

    TDIR=out/avbtest
    AVB_PARTS_VERITY=$(grep --no-filename -r PRODUCT_.*_VERITY_PARTITION {{ target_model_common_tree_path }} {{ target_model_device_tree_path }} \
                        | tr -d ' ' | cut -d : -f 1 | sort -u | sed -E 's/PRODUCT_(\w+)_VERITY_PARTITION/\1.img/g' | tr [[:upper:]] [[:lower:]] | tr '\n' ' ' \
                        || echo "nopartsfound")

    if [ -d "$TDIR" ];then rm -rf $TDIR;fi
    mkdir $TDIR
    unzip -oj {{ ZIPDIR }}/fastboot/{{ os_name }}-{{ los_version }}-{{ BUILDIDENT }}-*{{ target_model }}-fastboot.zip $AVB_PARTS_VERITY -d $TDIR

    {%      if not skip_avb_boot_verify %}
    AVB_PARTS_BOOT="boot.img" # AVB 1 is so old, we should not need to care about vendor/init boot parts here
    if $(grep -qr BOARD_RECOVERYIMAGE_PARTITION_SIZE {{ target_model_common_tree_path }} {{ target_model_device_tree_path }} );then
        AVB_PARTS_BOOT="$AVB_PARTS_BOOT recovery.img"
    fi
    unzip -oj {{ ZIPDIR }}/fastboot/{{ os_name }}-{{ los_version }}-{{ BUILDIDENT }}-*{{ target_model }}-fastboot.zip $AVB_PARTS_BOOT -d $TDIR
    echo -e "\n[AVB1-VERIFY] testing $AVB_PARTS_BOOT partitions"
    for p in $AVB_PARTS_BOOT;do
        echo -n "[AVB1-VERIFY] .. testing $p: "
        boot_signer -verify $TDIR/${p}
    done
    {%      endif %}

    if [ "$AVB_PARTS_VERITY" != "nopartsfound" -a ! -z "$AVB_PARTS_VERITY" ];then
        echo -e "\n[AVB1-VERIFY] testing $AVB_PARTS_VERITY partitions"
        for v in $AVB_PARTS_VERITY;do
            echo -n "[AVB1-VERIFY] ... testing $v: "
            verity_verifier $TDIR/${v} -mincrypt user-keys/verity_key
        done
    else
        echo -e "\n[AVB1-VERIFY] ERROR: No VERITY partition tests available, AVB_PARTS_VERITY: >$AVB_PARTS_VERITY<?!"
        exit 3
    fi
    {%   else   %}
    echo "[AVB-VERIFY] SKIPPING AVB verification: axp_avb_version is neither 1 nor 2, i.e. DISABLED?!"
    {%   endif   %}

    echo -e "\n\nSUCCESS:\nYou should find your build here:\n{{ ZIPDIR }}\n${ZIPINF}${FZIPINF}"
    {% endif %}

