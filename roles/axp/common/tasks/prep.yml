---

- block:

    - name: "Ensure the defined sources paths exist"
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ SRCPATH }}"
        - "{{ DOSPATH }}"
        - "{{ persistent_dir }}"
    
    - name: Copy DOS renamer
      copy:
        src: rename
        dest: "{{ SRCPATH }}/"
        mode: 0755

  when: ROM_FLAVOR != "kernel_patches_tester"

- name: "grab DOS CVE Checker"
  ansible.builtin.get_url:
    url: "{{ divest_cve_checker_download }}"
    dest: "{{ divest_cve_checker_jar }}"
    mode: 0640
  retries: 4
  delay: 30
  when: not skip_dl_cve_checker | bool | d(True)
