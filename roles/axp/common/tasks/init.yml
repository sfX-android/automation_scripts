---

- name: "Check AXP.OS state"
  ansible.builtin.stat:
    path: "{{ DOSPATH }}/.git"
  register: dosdir

- block:

    - name: "AXP.OS: Initial Sync"
      ansible.builtin.git:
        repo: "{{ axp_git_repo }}"
        dest: "{{ DOSPATH }}"
        version: "{{ axp_main_branch }}"
        accept_newhostkey: true
        force: true

    - name: "AXP.OS: Initial submodule Sync!"
      ansible.builtin.shell: |
          git fetch --all >> {{ BUILD_LOG }} 2>&1
          sed -i 's|git@gitlab.com:|https://gitlab.com/|' .git/config .gitmodules .git/modules/Patches/Linux/config .git/modules/PrebuiltApps/config >> {{ BUILD_LOG }} 2>&1
          git submodule update --init --recursive >> {{ BUILD_LOG }} 2>&1
          git submodule status >> {{ BUILD_LOG }} 2>&1
          git submodule update >> {{ BUILD_LOG }} 2>&1
          git submodule status >> {{ BUILD_LOG }} 2>&1
          git pull >> {{ BUILD_LOG }} 2>&1
          git log -1 >> {{ BUILD_LOG }} 2>&1
      args:
        executable: /bin/bash
        chdir: "{{ DOSPATH }}"

  when: dosdir.stat.isdir is undefined
