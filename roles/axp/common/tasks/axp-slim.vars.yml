---
# must be explicitly included!

# build vars
os_name: "AXP.OS-slim"

# ensure we use our common apps key used to signed our own apps (e.g. OpenEUICC)
common_apps_keydir: "/home/androidsource/do-not-touch/KEYS/{{ os_name }}"

# allow to (manually) set selinux permissive
#axp_allow_permissive: True

# extendrom stuff
extendrom_package_list_default: "additional_repos.xml AuroraStore"
extendrom_preroot_boot: "false"
extendrom_allow_any_call_recording: 'false'

# keys
KEYS_CN: "{{ os_name }}"
#keysdir: "{{ DOSPATH }}/Signing_Keys/4096pro/{{ target_model }}/"

device_cl: |-
  ***{{ target_model_full | regex_escape() }}*** ***\({{ target_model | regex_escape() }}\)*** \- ***{{ ROM_FLAVOR }}-slim | regex_escape() }}***

dl_links: |-
  ***Download:*** [{{ ROMFILE.stdout | regex_escape() }} ]({{ leech_server }}/{{ ROM_FLAVOR }}-slim/{{ target_model }})