---

- name: "Download latest Fairphone Firmware"
  ansible.builtin.shell: |
    {{ DOS_INIT }}
    
    {% if sub_model is defined %}
    lunch lineage_{{ sub_model }}${brf_suffix}-user && echo lunch success
    {% else %}
    lunch lineage_{{ target_model }}${brf_suffix}-user && echo lunch success
    {% endif %}
    resetEnv
    
    # quick workaround for unrecognized property "product_variables.device_has_arm_mte"
    mv external/hardened_malloc/Android.bp hmall.Androidbp
    
    export ALLOW_MISSING_DEPENDENCIES=true
    m -j{{ max_processes }} lpunpack >> {{ BUILD_LOG }} 2>&1

    # revert build workaround
    mv hmall.Androidbp external/hardened_malloc/Android.bp
    
    {{ SH_COMMON_FAIRPHONE_DL_FIRMWARE }}
  args:
    executable: /bin/bash
    chdir: "{{ SRCPATH }}"
  when:
    - target_model_vendor == "Fairphone"
    - download_fairphone_firmware | d(False)
