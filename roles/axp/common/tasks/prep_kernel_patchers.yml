---

- name: "Setup CVE kernel patcher"
  ansible.builtin.shell: |
    {{ DOS_INIT }}
    CROOT="{{ SRCPATH }}"
    set +e
    cd $CROOT

    {{ repo_bin }} forall -j{{ max_processes }} {{ target_kernel_dir }} -c "git am --abort; git rebase --abort; git add -A; git reset --hard" >> {{ BUILD_LOG }} 2>&1
    startPatcher {{ target_kernel_dir | regex_replace('/','_') }} >> {{ BUILD_LOG }} 2>&1
    {{ repo_bin }} forall -j{{ max_processes }} {{ target_kernel_dir }} -c "git am --abort; git rebase --abort; git add -A; git reset --hard" >> {{ BUILD_LOG }} 2>&1
    
    # comment out buggy ones
    cd {{ DOSPATH }}/Scripts/LineageOS-{{ los_version }}/CVE_Patchers
    bash {{ DOSPATH }}/Scripts/Common/Fix_CVE_Patchers.sh >> {{ BUILD_LOG }} 2>&1
  args:
    executable: /bin/bash

- name: "Ensure kernel patches will be committed properly"
  shell: |
    export LC_ALL=C
    {{ DOS_INIT }}

    # ensure we make proper commits
    # i.e.: git am instead of apply, fallback to "patch" + commit msg = patch name and a valid author
    P="patch -r - --no-backup-if-mismatch --forward --ignore-whitespace --verbose -p1 <"

    # massage kernel patchers
    sed -i -E 's#(^echo.*)git (am|apply) (\$DOS_PATCHES_LINUX_CVES/)(.*\.patch$)#\1git am \3\4 || \(git am --abort; '"$P"' \3\4 \&\& git add -A \&\& git commit --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "\4\n\nsource: ${DOS_PATCHER_URI_KERNEL}/\4"\) || exit 44#g' \
      {{ DOSPATH }}/Scripts/LineageOS-{{ los_version }}/CVE_Patchers/*.sh
  args:
    executable: /bin/bash
    chdir: "{{ SRCPATH }}"
