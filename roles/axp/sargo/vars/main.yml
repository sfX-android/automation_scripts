---
# human readable model name
target_model_vendor: "Google"
target_model_name: 'Pixel 3a'
target_model_full: "{{ target_model_vendor }} {{ target_model_name }}"

# boot debugger path & config
extendrom_debug_path_default: /metadata
extendrom_debug_path_size_full_default: 500
extendrom_debug_path_size_kernel_default: 100
extendrom_debug_path_size_selinux_default: 200
extendrom_debug_path_size_crash_default: 200

# path to the kernel dir (req for e.g. wireguard)
target_kernel_dir: kernel/google/msm-4.9

# path to the common tree, if none exists the device tree
# required e.g. for git, vendor/axp, release handling etc
target_model_common_tree: device_google_bonito

# add OpenEUICC and use 32bit WebView
axp_euicc_capable: true

# allow creating factory image
custom_build_command: "{{ SH_COMMON_PIXEL_CREATE_FACTORY }}"

# remove disk space reservation (e.g. on product partition)
remove_space_reservation: true

# git push
axp_git_push_device_include: "device_google_sargo|{{ target_model_common_tree }}"
axp_git_push_vendor_include: "vendor_google_sargo"

# disable Wireguard patching (already part of the upstream kernel)
#skip_wireguard: true

#################################################################################################################################
## Website info
#

# COMMON block
hugo_firmware: "included"

# Is the device an A/B device (legacy or virtual)?
# Can be either 'yes' or 'no'. use single quotes here:
hugo_isab: 'yes'

hugo_xda_link: "https://xdaforums.com/t/rom-a13-official-microg-hardened-sargo-axp-os-20-0.4722274/" # link to the AXP.OS XDA post for that device
hugo_kb_link: "sargo" # OPTIONAL: knownissues link, only if there is any, will be prefixed with "#"
hugo_tracker_link: "{{ axp_issue_tracker_queryall }}&labels=58" # "&labels=56" for enchilada

#### PRO block ####
android_version_pro: 13
hugo_relockable_pro: 'yes'
hugo_encryption_pro: "ICE" # device encryption type: no|FDE|ICE|FBEv1|FBEv2
axp_bootloader_id_pro: 'BB8B6D9E18C68E46' # if AVB: Bootloader ID (first line) for validating build log
hugo_axp_bootloader_id_pro: |
  BOOTLOADER minimal ID
        BB8B6D9E

  BOOTLOADER full ID:
        BB8B6D9E18C68E46
        369A874E6ADDB573
        41A349D9AC536C95
        1A0560AB2F63B07F
hugo_supportlevel_pro: "community"  # i.e.: "team" | "community"
hugo_first_releasedate_pro: "2025-03-01" # first public stable release date (YYYY-MM-DD)
hugo_state_pro: "stable" # "stable" | "!! ALPHA !!" | "BETA"
hugo_avb_pro: "{{ axp_avb_version }}" # AVB version - if different from the global one for this device
# can be one of: "Platform + Kernel + Firmware" | "Platform + Kernel" | "Kernel"
# "Platform + Kernel" = DEFAULT if unset
# hugo_patchlevel_pro: ""

#### SLIM block ####
android_version_slim: 13
hugo_relockable_slim: 'yes'
hugo_encryption_slim: "ICE" # device encryption type: no|FDE|ICE|FBEv1|FBEv2
axp_bootloader_id_slim: 'AC2F6121652F3607' # if AVB: Bootloader ID (first line) for validating build log
hugo_axp_bootloader_id_slim: |
  BOOTLOADER minimal ID
        AC2F6121

  BOOTLOADER full ID:
        AC2F6121652F3607
        71EEB5510F6DB2D2
        9CB444CE23F8A64E
        9D1FDB7175432C32
hugo_supportlevel_slim: "community" # i.e.: "team" | "community"
hugo_first_releasedate_slim: "2025-03-03" # first public stable release date (YYYY-MM-DD)
hugo_state_slim: "stable" # "stable" | "!! ALPHA !!" | "BETA"
hugo_avb_slim: "{{ axp_avb_version }}" # AVB version - if different from the global one for this device
# can be one of:
#   "Platform + Kernel + Firmware" | "Platform + Kernel" (DEFAULT if unset) | "Kernel"
# hugo_patchlevel_slim: ""


#################################################################################################################################
## FIRMWARE info
#
# source: https://developers.google.com/android/ota#sargo

vendor_firmware_download_url: "https://dl.google.com/dl/android/aosp/sargo-ota-sp2a.220505.008-2037245c.zip"
vendor_firmware_download_sha256: "2037245c06c8e0912c098c347be7b49a707d7cacf9a663ad7e68c96ce75ea32b"
# if specified: when file does not exist it will be stored there, if it does download will be skipped and the given one is used
# in any case the hash sum will be verified though.
vendor_firmware_persistent_path: "{{ persistent_dir }}/sargo-ota-sp2a.220505.008-2037245c.zip"
