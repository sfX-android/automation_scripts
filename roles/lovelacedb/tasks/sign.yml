---

- block:

   - name: Ensure gpg is installed
     ansible.builtin.package:
       name: gnupg
       state: present

   - name: "Sign all *.bin files in {{ sigdb_bin_path }}"
     ansible.builtin.shell: |
        #export GPG_TTY=$(tty)
        for db in $(find {{ sigdb_bin_path }} -type f -name '*.bin');do
            echo "signing $db"
            echo '{{ vault_lovelace_gpg_pass }}' | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sig --output ${db}.sig --sign $db
            #gpg --no-tty --armor --detach-sig --output ${db}.sig --sign --passphrase '{{ vault_lovelace_gpg_pass }}' $db
         done
     become: yes
     args:
       executable: /bin/bash
     #loop: "{{ lookup('fileglob', sigdb_bin_path + '*.bin') }}"
 #gpg --armor --detach-sig --output {{ item }}.sig --sign {{ item }}

   - name: "Verify all signed *.bin files"
     ansible.builtin.shell: |
       gpg --verify {{ item }}.sig {{ item }}
     loop: "{{ lookup('fileglob', sigdb_bin_path + '*.bin') }}"
     become: yes
   
  delegate_to: lovelacedb
