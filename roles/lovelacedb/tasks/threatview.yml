---

- name: "Threatview: Get & parse signatures"
  ansible.builtin.shell: |
    rm {{ hypatia_signatures_path }}/raw/threatview.*
    
    wget -q "{{ hypatia_uri_threatview_md5 }}" -O - | sed 's/MD5 of //' >> {{ hypatia_signatures_path }}/raw/threatview.md5
    wget -q "{{ hypatia_uri_threatview_md5 }}" -O - >> {{ hypatia_signatures_path }}/raw/threatview.sha1
    sort -u -o {{ hypatia_signatures_path }}/raw/threatview.md5 {{ hypatia_signatures_path }}/raw/threatview.md5
    sort -u -o {{ hypatia_signatures_path }}/raw/threatview.sha1 {{ hypatia_signatures_path }}/raw/threatview.sha1
  args:
    chdir: "{{ hypatia_signatures_path }}"
