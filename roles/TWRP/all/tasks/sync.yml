---

- name: "Clone device tree"
  git:
    repo: "{{ DTURI }}"
    dest: "{{ DTPATH }}/"
    version: "{{ DTBRANCH }}"
    force: true

- name: "Clone kernel"
  git:
    repo: "{{ KERNGIT }}"
    dest: "{{ KERNPATH }}/"
    version: "{{ KERNBRANCH }}"
    force: true
  when: 
    - KERNGIT is defined
    - KERNPATH is defined
    - KERNBRANCH is defined

- name: "Clone buildtools"
  git:
    repo: "{{ external_buildtools_uri }}"
    dest: "{{ external_buildtools_path }}/"
    version: "{{ external_buildtools_branch }}"
    force: true
  when: fetch_external_buildtools | d(False)
