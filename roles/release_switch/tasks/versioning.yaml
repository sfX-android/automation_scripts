---

- name: "RELDATE: prep"
  ansible.builtin.set_fact:
    task_temp_path: "{{ android_build_path }}/.tmp/versioning"
    tag_version: "{{ sm_build_id | replace(' ', '') }}"

- name: "RELDATE: start clean"
  ansible.builtin.file:
    path: "{{ task_temp_path }}"
    state: absent

- name: "Git block"
  block:

      - name: "RELDATE: fetch git repo"
        ansible.builtin.git:
          repo: "{{ git_axpos_org_private }}/axp_versioning"
          dest: "{{ task_temp_path }}"
          version: "{{ tag_version }}"
        timeout: 180

      - name: "RELDATE: set & push changes"
        ansible.builtin.shell: |
          export LC_ALL=C
          export PATH="~/.local/bin:$PATH"
          source {{ BUILDHOME }}/.divested.vars.{{ sub_model | d(target_model) }}
          set -e

          #cat {{ sub_model | d(target_model) }}_{{ axp_type }}.md

          # set tag name & type
          TAG="{{ tag_version }}"

          # update release date
          sed -E -i "s|(Release date:\*\*)(.*)|\1 $(date +%F) _({{ os_zip_filename }})_|g" \
            {{ sub_model | d(target_model) }}_{{ axp_type }}.md

          # commit if required
          CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)
          # commit if any of the above require it
          if [ $CMTL -gt 0 ];then
            git add -A
            git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "$TAG: {{ sub_model | d(target_model) }} {{ axp_type }} - stable"
            git tag -d "$TAG" 2>&1 || true
            git push --delete "$TAG" 2>&1 || true
            git tag -a "$TAG" -m "$TAG: last updated by {{ sub_model | d(target_model) }} {{ axp_type }}" 2>&1
            git push --force --set-upstream origin $TAG 2>&1
          else
            echo "NO CHANGES DETECTED: PUSH SKIPPED!"
          fi
        args:
          executable: /bin/bash
          chdir: "{{ task_temp_path }}"

      - name: "RELDATE: end clean"
        ansible.builtin.file:
          path: "{{ task_temp_path }}"
          state: absent

  rescue:

      #- name: "RELDATE: end clean"
      #  ansible.builtin.file:
      #    path: "{{ task_temp_path }}"
      #    state: absent

      - name: "RELDATE: failed"
        ansible.builtin.fail:
          msg: |
            ERROR OCCURED:

            {{ ansible_failed_result.msg | replace('"','') |replace("'","") | regex_replace('[}{]','') }}

            See above for details.
