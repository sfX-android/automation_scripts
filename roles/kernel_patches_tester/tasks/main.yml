---

- include_tasks: dl_patcher.yml

- name: "Identify models"
  connection: local
  ansible.builtin.shell: |
    ls -1 ../roles/{{ ROM_FLAVOR }} | grep -v common
  register: target_models

- name: "test"
  debug: 
    var: target_models

- include_tasks: patch.yml
  vars:
    target_model: "{{ model }}"
  loop: "{{ target_models.stdout | list }}"
  loop_control:
    loop_var: model
  
