---

- name: "Get local manifests (if set)"
  ansible.builtin.git:
    repo: "{{ git_repo_local_manifests }}"
    dest: "{{ SRCPATH }}/.repo/local_manifests"
    version: "{{ git_repo_local_manifests_branch }}"
    force: true
  timeout: 180
  when: git_repo_local_manifests is defined

- name: "Adjust local manifest (if requested)"
  when: local_manifest_replace | d(False)
  ansible.builtin.replace:
    path: "{{ local_manifest_replace_path }}"
    regexp: '{{ local_manifest_replace_regexp }}'
    replace: '{{ local_manifest_replace_string }}'

- name: "Init Android sources"
  ansible.builtin.shell: "{{ repo_bin }} init --repo-url="{{ repo_bin }}" -u {{ git_repo_main_manifests }} -b {{ git_repo_main_branch | d(REPOBRANCH) }} --git-lfs >> {{ BUILD_LOG }}"
  args:
    chdir: "{{ SRCPATH }}"

- name: "Sync"
  ansible.builtin.shell: |
      if [ -d .repo/repo ];then cd .repo/repo/ && git pull;fi
      cd {{ SRCPATH }}
      {{ repo_bin }} sync --jobs-checkout={{ max_processes }} --jobs-network={{ max_processes_sync }} {{ repo_sync_args }} >> {{ BUILD_LOG }} 2>&1\
        || {{ repo_bin }} sync --jobs-checkout={{ max_processes }} --jobs-network={{ max_processes_sync }} {{ repo_sync_args }} --fail-fast >> {{ BUILD_LOG }} 2>&1
  args:
    chdir: "{{ SRCPATH }}"
  no_log: "{{ debug_off | d(true) }}"

# git lfs can be a pita! i.e. it silently fails and you have no idea where.
# the following ensures we can catch known issues or print the error path at least
- name: "Sync LFS"
  ansible.builtin.shell: >
      {{ repo_bin }} forall -j{{ max_processes_sync }} -c 'git lfs pull || pwd | grep -E "OpenCL-CTS" ' >> {{ BUILD_LOG }}
  args:
    executable: /bin/bash
    chdir: "{{ SRCPATH }}"
  register: synclfs
  failed_when: synclfs.rc not in [ 0, 1 ]  # 1 means all have been skipped/no changes at all
  when: ROM_FLAVOR != 'MAID'
  # or (sync_lfs is defined and sync_lfs == 'true')
  no_log: "{{ debug_off | d(true) }}"
