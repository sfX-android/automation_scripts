---

- block:

  - name: "create directory if needed (i.e when using sub dirs in SRC_KEYSDIR)"
    ansible.builtin.file:
      path: "{{ SRCPATH }}/{{ SRC_KEYSDIR_BASE }}"
      state: directory
    when: SRC_KEYSDIR_BASE is defined
  
  - name: "Ensure keys dir is set correctly"
    ansible.builtin.shell: >
      {% if ROM_FLAVOR != "eos" and android_shortversion != "a9" %}
      external/buildtools/sign/sign_set_keysdir.sh {{ ROM_FLAVOR | regex_replace('e-os','eos') }} {{ android_shortversion }} >> {{ BUILD_LOG }} 2>&1
      {% else %}
      external/buildtools/sign/sign_set_keysdir.sh lineage {{ android_shortversion }} >> {{ BUILD_LOG }} 2>&1
      {% endif %}
    args:
      chdir: "{{ SRCPATH }}"
    environment:
      KEYS_DIR: "{{ keysdir }}"
      KEYS_DIR_LINKNAME: "{{ SRC_KEYSDIR }}"

  - name: "Ensure common 'apps' keys are used instead of generating them"
    ansible.builtin.file:
      src: "{{ common_apps_keydir }}/{{ item }}"
      dest: "{{ keysdir }}/{{ item }}"
      force: true
      state: link
    loop:
      - apps.pk8
      - apps.x509.pem
    when:
      - common_apps_keydir is defined
      - not (build_bootimage_only is defined and build_bootimage_only)

  - name: "Ensure we actually have keys (i.e. generate them if needed)"
    ansible.builtin.shell: |
        {{ DOS_INIT }}
        lunch lineage_{{ sub_model | d(target_model) }}${brf_suffix}-user >> {{ BUILD_LOG }} 2>&1
        external/buildtools/sign/sign_generate_keys.sh >> {{ BUILD_LOG }} 2>&1
    args:
      chdir: "{{ SRCPATH }}"
      executable: /bin/bash
    environment:
      CERT_DAYS_VERITY: "{{ KEYS_CERT_DAYS_VERITY }}"
      CERT_C: "{{ KEYS_CERT_C }}"
      CERT_O: "{{ KEYS_CERT_O }}"
      CERT_OU: "{{ KEYS_CERT_OU }}"
      CERT_CN: "{{ KEYS_CN }}"
      KEYS_DIR: "{{ SRC_KEYSDIR }}"
      USER_NAME: "{{ KEYS_USER }}"
      KSIZE: "{{ KEYS_SIZE }}"
      HASHTYPE: "{{ KEYS_HASHTYPE }}"
      AVB_VERSION: "{{ AVB_VERSION }}"

  when: sign_build is defined and (sign_build == "true" or sign_build)
