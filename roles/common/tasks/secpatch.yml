---

- name: "Set topics based on Android version"
  ansible.builtin.set_fact:
      sec_patch_topics: "{{ lookup('vars', 'sec_patch_topics_' + android_shortversion) }}"
      sec_patch_date_last: "{{ lookup('vars', 'sec_patch_date_last_' + android_shortversion) }}"
      sec_patch_topicname: "topic:{{ android_version_letter }}_asb_"
      current_pdate: "{{ current_year }}{{ current_month }}"

- name: "Set version as a date"  # also ensure we do not set a later ASB month than the current one
  ansible.builtin.set_fact:
      sec_patch_date_last_human: >-
         {% if (sec_patch_date_last | int) > (current_pdate | int) %}
         {{ current_year }}-{{ current_month }}
         {% elif (sec_patch_date_last | int | -1) | regex_replace('(^.{4})(.{2})','\2') == "00" %}
         {{ sec_patch_date_last | regex_replace('(^.{4})(.{2})','\1-\2') }}
         {% else %}
         {{ (sec_patch_date_last | int | -1) | regex_replace('(^.{4})(.{2})','\1-\2') }}
         {% endif %}

- name: "Construct exclusions (LOS, AOS, ...)"
  ansible.builtin.set_fact:
    secpatch_exclusionlist_los: "{{ secpatch_common_exclusions }}|{{ secpatch_los_exclusions }}"
  when: ROM_FLAVOR != "eos"

- name: "Construct exclusions (eOS)"
  ansible.builtin.set_fact:
    secpatch_exclusionlist_eos: "{{ secpatch_common_exclusions }}|{{ secpatch_los_exclusions }}|{{ secpatch_eos_exclusions }}"
  when: ROM_FLAVOR == "eos"

- name: "Check required variables"
  ansible.builtin.fail: |
    msg: 
      Missing a required variable!!
      
      Current definitions:
      {{ sec_patch_pick_branch | d('MISSING!!') }}
      {{ sec_patch_topics | d('MISSING!!') }}
      {{ sec_patch_date_last | d('MISSING!!') }}
      {{ SRCPATH | d('MISSING!!') }}
      {{ sec_patch_topicname | d('MISSING!!') }}
      
  when:
    - sec_patch_pick_branch is undefined
      or sec_patch_topics is undefined
      or sec_patch_date_last is undefined
      or SRCPATH is undefined
      or sec_patch_topicname is undefined

- name: "Define Query"
  ansible.builtin.set_fact:
    pick_query: >-
      {{ sec_patch_topics | flatten | map('regex_replace', '(^.{4})(.{2})', sec_patch_topicname + '\1-\2') | join(' OR ') }}

- block:
       
    - name: "SECURITY PATCH MERGE: create repopick list (required to find path names)"
      # "yes y" is required to continue when the changes are > 200
      ansible.builtin.shell: >
        yes y | /usr/bin/env python3 external/cherrypicker/scripts/cherrypicker.py -R los -B {{ sec_patch_pick_branch }} -Q '{{ pick_query }}' 
        | grep --color=never https | col | dos2unix
        | sed 's/\*Manifest Change\*/.repo/'
        | grep -iEv '{{ secpatch_exclusionlist_eos | d(secpatch_exclusionlist_los) }}'
      args:
        chdir: "{{ SRCPATH }}"
      register: picklist
      
    - name: "SECURITY PATCH MERGE: apply security patches up to: {{ sec_patch_date_last_human }}-01"
      ansible.builtin.shell: |
        source build/envsetup.sh > /dev/null
        echo "patch cmd: {{ item | regex_replace('-f ',' ') }}"
        {{ item | regex_replace('-f ',' ') }} -v >> {{ BUILD_LOG }} 2>&1 || {{ item }} -fv >> {{ BUILD_LOG }} || exit 123
      args:
        executable: /bin/bash
        chdir: "{{ SRCPATH }}"
      register: spres
      loop: "{{ picklist.stdout_lines }}"
      when: picklist.changed
    
    - name: "SECURITY PATCH MERGE: bump security patch version string to: {{ sec_patch_date_last_human }}-01"
      ansible.builtin.lineinfile:
        path: "{{ SRCPATH }}/build/core/version_defaults.mk"
        regexp: "PLATFORM_SECURITY_PATCH := .*"
        line: "PLATFORM_SECURITY_PATCH := {{ sec_patch_date_last_human }}-01"
      when: spres.changed

  when:
    - (override_reset_git == "undef" and reset_git == "true") or (override_reset_git == "true") or (override_sync == "true")
    - pick_query | length > 3
