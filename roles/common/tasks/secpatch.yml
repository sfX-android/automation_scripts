---

- name: "Set topics based on Android version"
  ansible.builtin.set_fact:
      sec_patch_topics: "{{ lookup('vars', 'sec_patch_topics_' + android_shortversion) }}"
      sec_patch_date_last: "{{ lookup('vars', 'sec_patch_date_last_' + android_shortversion) }}"
      sec_patch_topicname: "topic:{{ android_version_letter }}_asb_"

- name: "Normalize patch date"  # also ensure we do not set a later ASB month than the current one
  ansible.builtin.set_fact:
      sec_patch_date_real: "{{ sec_patch_date_last | int - 1 }}"

- name: "Set version as YYYY-MM"
  ansible.builtin.set_fact:
      sec_patch_date_last_human: >-
          {{ sec_patch_date_real | regex_replace('(^.{4})(.{2})','\1-\2') }}-{{ sec_patch_level }}

- name: "Construct exclusions (LOS, AOS, ...)"
  ansible.builtin.set_fact:
    secpatch_exclusionlist_los: "{{ secpatch_los_exclusions }}"
  when: ROM_FLAVOR != "eos"

- name: "Construct exclusions (eOS)"
  ansible.builtin.set_fact:
    secpatch_exclusionlist_eos: "{{ secpatch_los_exclusions }}|{{ secpatch_eos_exclusions }}"
  when: ROM_FLAVOR == "eos"

- name: "Check required variables"
  ansible.builtin.fail: |
    msg: 
      Missing a required variable!!
      
      Current definitions:
      {{ sec_patch_pick_branch | d('MISSING!!') }}
      {{ sec_patch_topics | d('MISSING!!') }}
      {{ sec_patch_date_last | d('MISSING!!') }}
      {{ SRCPATH | d('MISSING!!') }}
      {{ sec_patch_topicname | d('MISSING!!') }}
      
  when:
    - sec_patch_pick_branch is undefined
      or sec_patch_topics is undefined
      or sec_patch_date_last is undefined
      or SRCPATH is undefined
      or sec_patch_topicname is undefined

- name: "Flatten sec_patch_topics"
  ansible.builtin.set_fact:
    flattened_sec_patch_topics: "{{ sec_patch_topics | flatten }}"
 
- name: "Define Queries by ASB"
  ansible.builtin.set_fact:
    pick_queries: >-
      {{ pick_queries | d({}) | combine({
        item: (sec_patch_topicname ~ (item|string)|regex_replace('(^.{4})(.{2})', '\1-\2') ~ ' ' ~ secpatch_common_exclusions)
      }) }}
  loop: "{{ flattened_sec_patch_topics }}"
  
- block:
   
    - name: "SECURITY PATCH MERGE: create repopick lists by year (required to find path names)"
      # "yes y | " at the beginng is required to auto-continue when the changes are > 200
      ansible.builtin.shell: >
        yes y | /usr/bin/env python3 external/buildtools/cherrypicker.py -R los -B {{ sec_patch_pick_branch }} -Q '{{ item.value }}'
        | grep --color=never https | col | dos2unix
        | sed 's/\*Manifest Change\*/android/'
        {% if secpatch_exclusionlist_eos is defined and secpatch_exclusionlist_eos != '' %}| grep -iEv '{{ secpatch_exclusionlist_eos }}'{% endif %}
        {% if secpatch_exclusionlist_los is defined and secpatch_exclusionlist_los != '' %}| grep -iEv '{{ secpatch_exclusionlist_los }}'{% endif %}
        ; exit ${PIPESTATUS[1]}
      args:
        chdir: "{{ SRCPATH }}"
        executable: /bin/bash
      register: picklist
      loop: "{{ pick_queries | dict2items }}"
      loop_control:
        label: "{{ item.key }}"  # Using ASB as the label for the loop
      changed_when: picklist.changed
      until: picklist.changed

    # as Ansible cannot break from a loop we detect issues and set an indicator file instead so we can skip following tasks
    - name: "Cleanup a previous cherry pick failed indicator"
      ansible.builtin.file:
          path: "{{ SRCPATH }}/CHERRYPICK.FAILED"
          state: absent

    - name: "SECURITY PATCH MERGE: apply security patches in ASB order"
      ansible.builtin.shell: |
        if [ -f CHERRYPICK.FAILED ]; then echo "Previous cherry-picked failed!! Skipping...."; exit 3; fi
        unset id order batch
        cmd="{{ cherry | regex_replace('-f ',' ') | regex_replace('external/dng/sdk','external/dng_sdk') }}"
        
        # set static order if required
        for batch in {{ secpatch_static_dependencies }};do
          id="${batch/:*}"
          chk=$(echo "$cmd" | grep -c "$id")
          if [ $chk -gt 0 ];then
            deps=$(echo "${batch/*:}" | tr ',' ' ')
            
            for cl in $deps;do
              cmd=$(echo "$cmd" | sed "s/$cl//g")
            done
            
            cmd=$(echo "$cmd" | sed "s/$id/$deps $id/g")
            echo "FORCED NEW PATCH ORDER for: $id ($deps $id)"
          fi
        done
        
        source build/envsetup.sh > /dev/null
        echo -e "patching ASB:\n$cmd"
        
        $cmd -v >> {{ BUILD_LOG }} 2>&1 || $cmd -fv >> {{ BUILD_LOG }} || (touch CHERRYPICK.FAILED ;exit 123)
      args:
        executable: /bin/bash
        chdir: "{{ SRCPATH }}"
      register: spres
      loop: "{{ picklist.results | selectattr('changed', 'eq', True) 
               | sort(attribute='item.key') 
               | map(attribute='stdout_lines') 
               | flatten }}"
      when: picklist.changed
      loop_control:
        loop_var: cherry
    
    - name: "SECURITY PATCH MERGE: bump security patch version string (A13 and older)"
      ansible.builtin.lineinfile:
        path: "{{ SRCPATH }}/build/core/version_defaults.mk"
        regexp: "PLATFORM_SECURITY_PATCH := .*"
        line: "PLATFORM_SECURITY_PATCH := {{ sec_patch_date_last_human }}"
      when:
        - (spres.changed or force_secpatchdate)
        - android_version_int | int < 14

    - name: "SECURITY PATCH MERGE: bump security patch version string (A14 and later)"
      ansible.builtin.lineinfile:
        path: "{{ SRCPATH }}/build/release/flag_values/{{ android_target_release }}/RELEASE_PLATFORM_SECURITY_PATCH.textproto"
        regexp: "(string_value:\\s+)("[0-9-]+")"
        line: '\1"{{ sec_patch_date_last_human }}"'
      when:
        - (spres.changed or force_secpatchdate)
        - android_version_int | int > 13

    - name: "Git commit version bump"
      ansible.builtin.shell: |
          export LC_ALL=C
          {{ DOS_INIT |d('export AXP_GIT_AUTHOR="$USER" AXP_GIT_MAIL="$USER_MAIL"') }}
          CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)
          if [ $CMTL -gt 0 ];then
              git add -A >> {{ BUILD_LOG }} 2>&1 || CMT=1
              git commit {{ git_commit_args | d('') }} --author="${AXP_GIT_AUTHOR} <${AXP_GIT_MAIL}>" -m "bump security patch date: {{ sec_patch_date_last_human }}"
              echo "[GIT] bumped security patch date: {{ sec_patch_date_last_human }}" >> {{ BUILD_LOG }}
          fi
      args:
        executable: /bin/bash
        chdir: "{{ SRCPATH }}/build/core"
      when: spres.changed

  rescue:
    - name: "Fail fast on failures" # fail immediately and not waiting for finishing full loops
      ansible.builtin.fail:
        msg: "Failed, stopping NOW!"

  when:
    - (override_reset_git == "undef" and reset_git == "true") or (override_reset_git == "true") or (override_sync == "true")
    - pick_queries is defined and (pick_queries | length > 0)
