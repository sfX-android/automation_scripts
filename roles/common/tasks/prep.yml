---

- name: "Prep temp dir"
  ansible.builtin.file:
    path: "{{ server_tmp_dir }}"
    state: directory
    mode: '0700'

- name: "Prepare common tasks"
  when: android_shortversion is defined
  block:

      - name: "Ensure no compat bin links exist"
        ansible.builtin.file:
          path: "{{ item }}"
          state: absent
        loop:
          - "~/.local/bin/python"
          - "~/.local/bin/gcc"
        when: android_shortversion != "a9"
    
      - name: "Ensure compat bin links exist"
        ansible.builtin.file:
          src: "{{ item.target }}"
          path: "{{ item.lname }}"
          state: link
        loop:
          - { lname: "~/.local/bin/gcc", target: "/usr/bin/gcc-9"  }
          - { lname: "~/.local/bin/python", target: "/usr/bin/python2" }
        when: android_shortversion == "a9"

      - name: "Remove any previous log file"
        ansible.builtin.shell: >-
            find {{ BUILDHOME }} -maxdepth 1 -name '{{ build_log_name_noid }}*.log' -delete
        when: not keep_build_logs

      - name: "Setup logging symlink for 'latest'"
        ansible.builtin.file:
          src: "{{ BUILD_LOG }}"
          dest: "{{ BUILD_LOG_LATEST }}"
          force: true
          state: link
        when: not skip_build_log_symlink | d(False)

      - name: "Cleanup old build log"
        file:
          path: "{{ BUILD_LOG }}"
          state: absent
        when: not keep_build_logs

      - name: "Cleanup old build log (ansible host)"
        connection: local
        file:
          path: "/tmp/{{ inventory_hostname }}/build_{{ target_model }}_{{ android_shortversion }}_{{ ROM_FLAVOR }}.log"
          state: absent
        when: not keep_build_logs
