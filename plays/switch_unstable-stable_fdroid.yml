---

- name: "F-Droid: Switch between BETA & STABLE"
  hosts: fdroidserver
  gather_facts: true
  become: no

  vars:
    target_model: "F-Droid"
    tg_success: |
        {{ ICON_GOOD }} ***The AXP\.OS \- Stable F\-Droid repo has received an update\!***
        \(repo details can be found [here](https://axpos.org/F-Droid)\)

        App\(s\): _{{ app_name | regex_replace('"','') | regex_replace('%%','') | regex_escape() }}_
        Version: _{{ app_version | regex_escape() | regex_replace('_.*', '') }}_
    tg_failed: |
        {{ ICON_BAD }} ***F\-Droid App release ERROR***
        {{ app_name | regex_replace('%%','') | regex_escape() }}:
        switching {{ app_version | regex_escape() | regex_replace('_.*', '') }} to STABLE failed\!
  
  tasks:
    - block:

      #- import_role:
      #    name: common

      - include_role:
          name: common
          tasks_from: justvault.yml
          public: yes

      - fail:
          msg: "boo.. vault_tg_group_id_failing is undefined"
        when: 
          - vault_tg_group_id_failing is undefined
          - telegram_notifications | bool

      - set_fact:
          tg_group_id: "{{ vault_tg_group_id_automation }}"
          #tg_group_id: "{{ vault_tg_group_id_failing }}"
        when:
          - telegram_notifications | bool
        
      - name: "F-Droid: switch"
        become: yes
        become_user: "{{ fdroid_srv_user }}"
        ansible.builtin.shell: |
            app_and_version=$(echo "{{ app_name }}" | sed 's/%%/_{{ app_version }}/g')
            bash {{ fdroidpath }}/update_repo.sh {{ fdroid_switch_type }} "$app_and_version"
  
      - name: "Set result (compat fix for release role)"
        ansible.builtin.shell: 'true'
        register: buildresult
  
      - include_role:
          name: notify

      # when any of the above fails notify always 
      rescue:

        - set_fact:
            tg_group_id: "{{ vault_tg_group_id_failing }}"
          when:
            - telegram_notifications | bool

        - include_role:
            name: notify
           
        - fail:
            msg: |
              ERROR OCCURED:
              
              {{ ansible_failed_result.msg | replace('"','') |replace("'","") | regex_replace('[}{]','') }}
              
              See above for details.
