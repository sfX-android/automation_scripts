---
- name: Manage Docker container for image updates
  hosts: "{{ groups.docker[0] }}"
  gather_facts: true
  vars:
    base_image: "{{ BASEIMG }}"
    command_to_run: "{{ CMD }}"
    container_name: "temp_container_{{ ansible_date_time.epoch }}"
    
  tasks:

    - name: Create, execute, and commit Docker container workflow
      block:
        - name: Create Docker container from existing image
          community.docker.docker_container:
            name: "{{ container_name }}"
            image: "{{ base_image }}"
            state: started
            detach: true
            tty: true
            command: "/bin/sh"
            auto_remove: false
            recreate: true

        - name: Execute command in running container
          community.docker.docker_container_exec:
            container: "{{ container_name }}"
            command: "/bin/bash -c '{{ command_to_run }}'"
            chdir: "/"
            user: root
            detach: false

        - name: Commit container changes to update base image
          community.docker.docker_image:
            name: "{{ base_image }}"
            source: "local"
            state: present
            buildargs: {}
            pull: false
            force_source: true
            commit: "{{ container_name }}"
            tag: "latest"

        - name: Remove temporary container
          community.docker.docker_container:
            name: "{{ container_name }}"
            state: absent
            force_kill: true

      rescue:
        - name: Clean up temporary container on failure
          community.docker.docker_container:
            name: "{{ container_name }}"
            state: absent
            force_kill: true

        - name: Failed state
          fail:
            msg: |
              ________________________________________________________
              Workflow failed due to an exception!
              Last error was (check {{ ansible_failed_task.name }}):
              
              {% if ansible_failed_result.msg is defined %}
              {{ ansible_failed_result.msg | replace('"','') |replace("'","") | regex_replace('[}{]','') }}
              {% elif ansible_failed_task.msg is defined %}
              {{ ansible_failed_task.msg | replace('"','') |replace("'","") | regex_replace('[}{]','') }}
              {% endif %}
              
              Container '{{ container_name }}' may need manual cleanup.
              ________________________________________________________
              
