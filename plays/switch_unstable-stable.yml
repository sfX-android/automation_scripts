---

- name: "Switch from unstable to stable"
  hosts: "{{ groups.downloadserver[0] }}"
  gather_facts: false
  become: no

  vars:
    os_zip_filename_no_ext: "{{ os_zip_filename | regex_replace('.zip','') }}"
    recovery_filename_no_ext: >-
      {{ os_zip_filename_no_ext | regex_replace('(.+-[0-9]+\.[0-9]+-[0-9]{8}).*','\1') }}
    #tg_success: |
    #    {{ ICON_GOOD }} ***New build released\!***
    #    {{ target_model | regex_escape() }}: successfully switched {{ os_zip_filename_no_ext | regex_escape() }} to STABLE channel
    tg_failed: |
        {{ ICON_BAD }} ***ERROR***
        {{ target_model | regex_escape() }}: switching {{ os_zip_filename_no_ext | regex_escape() }} to STABLE failed\!
  
  tasks:
    - block:

      - import_role:
          name: common

      - include_role:
          name: "{{ ROM_FLAVOR }}/common"
          tasks_from: set_env_vars.yml
          public: yes
        when: ROM_FLAVOR == "axp" or ROM_FLAVOR == "graphene" or ROM_FLAVOR == "eos"

      - include_vars: "../roles/{{ ROM_FLAVOR }}/common/tasks/axp-slim.vars.yml"
        when: axp_type | d('') == "slim"

      - include_vars: "../roles/{{ ROM_FLAVOR }}/{{ target_model }}/vars/main.yml"
      - include_vars: "../roles/{{ ROM_FLAVOR }}/{{ parent_model }}/vars/main.yml"
          #file: "../roles/{{ ROM_FLAVOR }}/{{ parent_model }}/vars/main.yml"
          #hash_behaviour: merge
        when: parent_model is defined
      
      - fail:
          msg: "boo.. vault_tg_group_id_failing is undefined"
        when: 
          - vault_tg_group_id_failing is undefined
          - telegram_notifications | bool

      - set_fact:
          tg_group_id: "{{ vault_tg_group_id_automation }}"
        when:
          - telegram_notifications | bool

      - name: "Include release switch role"
        ansible.builtin.include_role:
          name: release_switch
          public: true 

      - name: "Set result (compat fix for release role)"
        ansible.builtin.shell: 'true'
        register: buildresult
  
      - name: "Post commands"
        ansible.builtin.shell: |
          {{ postcmd_switch_to_stable }}
        args:
          executable: /bin/bash
        when: 
          - postcmd_switch_to_stable is defined
          - buildresult.rc == 0

      - include_role:
          name: notify

      # when any of the above fails notify always 
      rescue:

        - set_fact:
            tg_group_id: "{{ vault_tg_group_id_failing }}"
          when:
            - telegram_notifications | bool

        - include_role:
            name: notify
           
        - fail:
            msg: |
              ERROR OCCURED:
              
              {{ ansible_failed_result.msg | replace('"','') |replace("'","") | regex_replace('[}{]','') }}
              
              See above for details.
